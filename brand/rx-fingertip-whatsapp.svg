<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f8a4a"/>
      <stop offset="1" stop-color="#0a6b3a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <!-- fingertip: rounded finger shape with a print swirl -->
  <g transform="translate(320 250)">
    <path d="M-78 120 V-30 a78 78 0 0 1 156 0 V120 Z" fill="#ffffff"/>
    <g fill="none" stroke="#0f8a4a" stroke-width="9" stroke-linecap="round">
      <path d="M-48 70 V-22 a48 48 0 0 1 96 0 V70"/>
      <path d="M-24 70 V-18 a24 24 0 0 1 48 0 V70"/>
      <path d="M0 70 V-8"/>
    </g>
    <!-- medical cross badge -->
    <circle cx="70" cy="-70" r="44" fill="#ffd54a" stroke="#0a6b3a" stroke-width="8"/>
    <path d="M62 -96 h16 v18 h18 v16 h-18 v18 h-16 v-18 h-18 v-16 h18 z" fill="#0a6b3a"/>
  </g>
  <text x="320" y="452" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="700" fill="#ffffff">Rx Fingertip</text>
  <text x="320" y="508" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#d9f2e3" letter-spacing="2">SEVA</text>
</svg>
