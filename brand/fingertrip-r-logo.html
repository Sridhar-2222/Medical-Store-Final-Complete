<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0}
.tile{width:640px;height:640px;background:linear-gradient(135deg,#0f8a4a,#0a6b3a);display:flex;align-items:center;justify-content:center}
.word{display:flex;align-items:flex-end;font:700 92px/1 Arial,Helvetica,sans-serif;color:#fff;letter-spacing:-1px}
.word span{padding-bottom:0}
.r{height:150px;width:auto;margin:0 2px 11px 4px;display:block}
</style></head><body>
<div class="tile"><div class="word"><span>Fingert</span>
<svg class="r" viewBox="0 0 120 180" xmlns="http://www.w3.org/2000/svg">
  <!-- R: stem + round bowl + leg, in yellow -->
  <rect x="0" y="0" width="30" height="180" rx="4" fill="#ffd54a"/>
  <path d="M0 0 H62 A54 54 0 0 1 62 108 H0 Z" fill="#ffd54a"/>
  <path d="M46 96 L80 96 L120 180 L84 180 Z" fill="#ffd54a"/>
  <!-- fingerprint marks inside the round top -->
  <g fill="none" stroke="#0a6b3a" stroke-width="7" stroke-linecap="round">
    <path d="M40 92 V52 a24 24 0 0 1 48 0 V80"/>
    <path d="M52 92 V54 a12 12 0 0 1 24 0 V84"/>
    <path d="M64 92 V58"/>
    <path d="M30 70 V48 a34 34 0 0 1 66 -8"/>
  </g>
</svg><span>ip</span></div></div>
</body></html>
