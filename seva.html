<!DOCTYPE html>
<html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seva Workers</title>
<style>
*{font-family:system-ui;box-sizing:border-box} body{margin:0;background:#f6f8fb;padding:15px;max-width:640px;margin:auto;color:#1b1f24}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px #0001;margin-bottom:15px}
h2{margin:6px 0 12px} h3{margin:0 0 10px} .te{color:#55606d;font-size:.9em}
label{display:block;margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:11px;border:1px solid #cfd6de;border-radius:10px;font-size:16px}
.btn{background:#0d7c3e;color:#fff;border:0;padding:13px 18px;border-radius:10px;font-weight:600;cursor:pointer;width:100%;font-size:16px;margin-top:14px}
.btn:disabled{opacity:.6}
.small{padding:8px 12px;border-radius:8px;border:1px solid #cfd6de;background:#fff;cursor:pointer;font-size:14px}
.consent{display:flex;gap:10px;align-items:flex-start;background:#fff8e6;border-radius:10px;padding:10px;margin-top:12px}
.consent input{width:auto;margin-top:4px;transform:scale(1.3)}
.err{color:#b00020;font-size:14px;margin-top:4px} .ok{color:#0d7c3e;font-weight:600}
.row{display:flex;gap:10px} .row>*{flex:1}
.w{border-bottom:1px solid #eee;padding:12px 0;display:flex;gap:10px;align-items:center}
.w .info{flex:1} .w .name{font-weight:700} .w .meta{color:#55606d;font-size:14px}
.call{background:#0d7c3e;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:600;white-space:nowrap}
.free{background:#e3f6ea;color:#0d7c3e;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600}
.pin{display:none} .pin.show{display:block}
</style></head><body>
<h2>🤝 Seva workers <span class="te">· సేవ పనివాళ్ళు</span></h2>
<p class="te" style="margin-top:0"><a href="/seva/calls" style="color:#0d7c3e">Missed calls from elders →</a></p>

<div class="card">
  <h3>List a worker <span class="te">· పనివాళ్ళను చేర్చండి</span></h3>
  <p class="te" style="margin-top:0">For people with no smartphone. Customers will see the name, work, area and phone number, and call them directly.</p>
  <form id="f" novalidate>
    <label for="name">Worker's name <span class="te">· పేరు</span></label>
    <input id="name" name="name" autocomplete="off" required>
    <div class="err" data-for="name"></div>

    <label for="phone">Their phone number <span class="te">· ఫోన్ నంబర్</span></label>
    <input id="phone" name="phone" inputmode="numeric" placeholder="98480 12345" required>
    <div class="err" data-for="phone"></div>

    <div class="row">
      <div>
        <label for="work">Work <span class="te">· పని</span></label>
        <select id="work" name="work" required><option value="">Choose…</option></select>
        <div class="err" data-for="work"></div>
      </div>
      <div>
        <label for="area">Area / village <span class="te">· ప్రాంతం</span></label>
        <input id="area" name="area" required>
        <div class="err" data-for="area"></div>
      </div>
    </div>

    <div id="detailWrap" style="display:none">
      <label for="work_detail">What work? <span class="te">· ఏ పని?</span></label>
      <input id="work_detail" name="work_detail">
      <div class="err" data-for="work_detail"></div>
    </div>

    <label for="registered_by">Listed by (your name or shop) <span class="te">· మీ పేరు / షాప్</span></label>
    <input id="registered_by" name="registered_by" required>
    <div class="err" data-for="registered_by"></div>

    <div class="consent">
      <input type="checkbox" id="consent" name="consent">
      <label for="consent" style="margin:0;font-weight:500">I read this to the worker and they said <b>yes</b>: "Your name, work, area and phone number will be shown to customers, who may call you. Tell us any time to remove it."<br>
      <span class="te">"మీ పేరు, పని, ప్రాంతం, ఫోన్ నంబర్ కస్టమర్లకు కనిపిస్తాయి, వాళ్ళు మీకు కాల్ చేయవచ్చు. ఎప్పుడైనా తీసివేయమని చెప్పవచ్చు." — వారు ఒప్పుకున్నారు.</span></label>
    </div>
    <div class="err" data-for="consent"></div>

    <label for="consent_note">Note (optional) <span class="te">· గమనిక</span></label>
    <input id="consent_note" name="consent_note" placeholder="e.g. son was present">

    <div class="pin" id="pinWrap">
      <label for="pin">Helper PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off">
    </div>

    <button class="btn" id="save" type="submit">List this worker</button>
    <p id="msg" aria-live="polite"></p>
  </form>
</div>

<div class="card">
  <h3>Find a worker <span class="te">· పనివాళ్ళను వెతకండి</span></h3>
  <div class="row">
    <select id="qWork"><option value="">All work</option></select>
    <input id="qArea" placeholder="Area">
  </div>
  <div id="list" aria-live="polite"></div>
</div>

<script>
const API = '/api/seva';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let pin = '';
try { pin = sessionStorage.getItem('sevaPin') || ''; } catch {}
if (pin) $('pin').value = pin;

async function call(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  const p = $('pin').value || pin;
  if (p) headers['x-helper-pin'] = p;
  const res = await fetch(API + path, { ...opts, headers });
  if (res.status === 401) { $('pinWrap').classList.add('show'); throw new Error('Enter the helper PIN and try again.'); }
  if (p) { pin = p; try { sessionStorage.setItem('sevaPin', p); } catch {} }
  const body = res.status === 204 ? null : await res.json().catch(() => null);
  return { res, body };
}

async function loadTypes() {
  try {
    const { body } = await call('/work-types');
    const opts = body.map((t) => `<option value="${esc(t)}">${esc(t[0].toUpperCase() + t.slice(1))}</option>`).join('');
    $('work').insertAdjacentHTML('beforeend', opts);
    $('qWork').insertAdjacentHTML('beforeend', opts);
  } catch { $('list').innerHTML = '<p class="err">Seva server not reachable. Open this page from the app server, not the static site.</p>'; }
}

$('work').onchange = () => { $('detailWrap').style.display = $('work').value === 'other' ? 'block' : 'none'; };

$('f').onsubmit = async (e) => {
  e.preventDefault();
  document.querySelectorAll('.err').forEach((el) => (el.textContent = ''));
  $('msg').textContent = '';
  const data = Object.fromEntries(new FormData($('f')));
  data.consent = $('consent').checked;
  $('save').disabled = true;
  try {
    const { res, body } = await call('/workers', { method: 'POST', body: JSON.stringify(data) });
    if (res.ok) {
      $('msg').innerHTML = `<span class="ok">✅ ${esc(body.name)} is listed. Customers can now find them.</span>`;
      const by = $('registered_by').value;
      $('f').reset(); $('registered_by').value = by; $('detailWrap').style.display = 'none';
      search();
    } else if (body?.errors) {
      for (const [k, v] of Object.entries(body.errors)) {
        const el = document.querySelector(`.err[data-for="${k}"]`);
        if (el) el.textContent = v;
      }
      $('msg').innerHTML = '<span class="err">Please fix the items marked above.</span>';
    } else { throw new Error(body?.error || 'Could not save.'); }
  } catch (err) { $('msg').innerHTML = `<span class="err">${esc(err.message)}</span>`; }
  $('save').disabled = false;
};

async function search() {
  const q = new URLSearchParams({ work: $('qWork').value, area: $('qArea').value.trim() });
  try {
    const { body } = await call('/workers?' + q);
    $('list').innerHTML = body.length ? body.map((w) => `
      <div class="w">
        <div class="info">
          <div class="name">${esc(w.name)} ${w.free_today ? '<span class="free">🟢 Free today</span>' : ''}</div>
          <div class="meta">${esc(w.work === 'other' ? w.work_detail : w.work)} · ${esc(w.area)} · ${esc(w.phone)}</div>
          <div style="margin-top:6px;display:flex;gap:6px">
            <button class="small" data-free="${esc(w.id)}" data-on="${w.free_today ? 0 : 1}">${w.free_today ? 'Not free today' : 'Mark free today'}</button>
            <button class="small" data-remove="${esc(w.id)}" data-name="${esc(w.name)}">Remove</button>
          </div>
        </div>
        <a class="call" href="tel:+91${esc(w.phone)}">📞 Call</a>
      </div>`).join('') : '<p class="te">No workers listed yet for this search.</p>';
  } catch (err) { $('list').innerHTML = `<p class="err">${esc(err.message)}</p>`; }
}

$('list').onclick = async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  try {
    if (b.dataset.free) {
      await call(`/workers/${b.dataset.free}/free-today`, { method: 'POST', body: JSON.stringify({ free: b.dataset.on === '1' }) });
    } else if (b.dataset.remove) {
      if (!confirm(`Remove ${b.dataset.name} from Seva? Do this when they ask.`)) return;
      await call(`/workers/${b.dataset.remove}`, { method: 'DELETE' });
    }
    search();
  } catch (err) { alert(err.message); }
};

let t; $('qArea').oninput = () => { clearTimeout(t); t = setTimeout(search, 300); };
$('qWork').onchange = search;
loadTypes().then(search);
</script>
</body></html>
