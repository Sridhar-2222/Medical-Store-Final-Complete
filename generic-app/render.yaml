services:
  - type: web
    name: bizcore
    runtime: node
    rootDir: generic-app
    buildCommand: echo "no dependencies to install"
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: APP_PIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
