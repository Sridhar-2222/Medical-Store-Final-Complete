<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* BizCore — layout: fixed ledger-style sidebar + working area; drawer on phones. */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --surface-2: #eaeef5;
  --line: #d8dee9;
  --fg: #172033;
  --muted: #5b6579;
  --ink: #2448c8;          /* accent: ledger ink blue */
  --ink-soft: #e3e9fb;
  --on-ink: #ffffff;
  --good: #137a4b; --good-soft: #dff3e9;
  --warn: #9a5b00; --warn-soft: #fbefd9;
  --bad: #b3261e;  --bad-soft: #fbe4e2;
  --shadow: 0 1px 2px rgba(23, 32, 51, .06), 0 4px 16px rgba(23, 32, 51, .06);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1420; --surface: #161d2c; --surface-2: #1e2738; --line: #2b3549; --fg: #e6eaf3; --muted: #9aa5bb;
    --ink: #7d9bff; --ink-soft: #1f2b4d; --on-ink: #0b1020;
    --good: #5fd39b; --good-soft: #143426; --warn: #f0b45a; --warn-soft: #3a2b12; --bad: #ff8a80; --bad-soft: #3d1a19;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1420; --surface: #161d2c; --surface-2: #1e2738; --line: #2b3549; --fg: #e6eaf3; --muted: #9aa5bb;
  --ink: #7d9bff; --ink-soft: #1f2b4d; --on-ink: #0b1020;
  --good: #5fd39b; --good-soft: #143426; --warn: #f0b45a; --warn-soft: #3a2b12; --bad: #ff8a80; --bad-soft: #3d1a19;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.15rem; } h3 { font-size: 1rem; }
a { color: var(--ink); }
.num, td.num, .money { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-data); font-size: .85em; }
.muted { color: var(--muted); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100%; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 16px 10px; display: flex; flex-direction: column; gap: 4px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--ink); color: var(--on-ink); display: grid; place-items: center;
  font: 700 15px var(--font-display); flex: none; }
.brand-name { font: 700 15px/1.2 var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand-sub { font-size: 12px; color: var(--muted); }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--fg); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); }
.nav a.active { background: var(--ink-soft); color: var(--ink); }
.nav .ico { width: 20px; text-align: center; }
.nav .pill { margin-left: auto; }
.side-foot { margin-top: auto; padding: 10px; font-size: 12px; color: var(--muted); display: grid; gap: 6px; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 10px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.topbar h1 { font-size: 1.15rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn.menu-btn { display: none; }
.content { padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px; align-content: start; max-width: 1280px; width: 100%; }
.scrim { display: none; }

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 auto 0 0; width: 260px; z-index: 30; transform: translateX(-102%); transition: transform .2s;
    padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-left: calc(10px + env(safe-area-inset-left, 0px)); box-shadow: var(--shadow); }
  body.nav-open .side { transform: none; }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; }
  .btn.menu-btn { display: inline-flex; }
}

/* ---------- building blocks ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.panel-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.panel-head h2 { flex: 1; min-width: 140px; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 2px; text-decoration: none; color: inherit; }
.tile .label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tile .value { font: 600 1.4rem/1.25 var(--font-display); font-variant-numeric: tabular-nums; }
.tile .hint { font-size: 12px; color: var(--muted); }
.tile.alert { border-color: var(--warn); }
.tile.alert .value { color: var(--warn); }
.tile.danger .value { color: var(--bad); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.stack { display: grid; gap: 10px; }

.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 14px; border-radius: 8px;
  font: 500 14px var(--font-body); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; white-space: nowrap; min-height: 36px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: 4px 10px; min-height: 30px; font-size: 13px; }
.btn.big { padding: 12px 18px; font-size: 16px; font-weight: 600; width: 100%; justify-content: center; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.ink { background: var(--ink-soft); color: var(--ink); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 4px 12px; border-radius: 999px; cursor: pointer; font: 500 13px var(--font-body); }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }

input, select, textarea { font: 14px var(--font-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; width: 100%; min-height: 36px; }
textarea { min-height: 90px; resize: vertical; }
input[type=checkbox] { width: auto; min-height: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--ink-soft); border-color: var(--ink); }
label.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; min-width: 0; }
label.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.form-grid .wide { grid-column: 1 / -1; }
.search { max-width: 340px; }

.table-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
td.actions { text-align: right; white-space: nowrap; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }
.empty { padding: 28px 12px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-size: 15px; margin-bottom: 4px; }

/* ---------- POS ---------- */
.pos { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1000px) { .pos { grid-template-columns: 1fr; } }
.catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; max-height: 60vh; overflow-y: auto; padding: 2px; }
.prod { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px; cursor: pointer; display: grid; gap: 2px; font: inherit; color: inherit; }
.prod:hover { border-color: var(--ink); }
.prod .n { font-weight: 600; line-height: 1.25; }
.prod .p { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
.prod .s { font-size: 12px; color: var(--muted); }
.prod.out { opacity: .55; }
.cart { position: sticky; top: 76px; }
.cart-line { display: grid; grid-template-columns: 1fr 70px 84px 28px; gap: 6px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.cart-line input { padding: 4px 6px; min-height: 30px; text-align: right; }
.cart-line .nm { font-weight: 600; line-height: 1.2; min-width: 0; overflow-wrap: anywhere; }
.cart-line .sub { font-size: 12px; color: var(--muted); }
.totals { display: grid; gap: 4px; margin-top: 10px; }
.totals div { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.totals .grand { font: 700 1.35rem var(--font-display); border-top: 1px solid var(--line); padding-top: 6px; }

/* ---------- chart ---------- */
.bars svg { width: 100%; height: auto; display: block; }
.bars .bar { fill: var(--ink); }
.bars .bar.zero { fill: var(--line); }
.bars text { fill: var(--muted); font: 10px var(--font-body); }
.bars .grid-line { stroke: var(--line); stroke-width: 1; }

/* ---------- modal / toast ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(10, 14, 25, .45); z-index: 50; display: grid; place-items: start center; overflow-y: auto;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); border-radius: 12px; width: min(640px, 100%); box-shadow: var(--shadow); border: 1px solid var(--line); }
.modal.wide { width: min(1080px, 100%); }
.modal-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.modal-head h2 { flex: 1; }
.modal-body { padding: 16px; display: grid; gap: 14px; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 60; }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow); max-width: 360px; }
.toast.err { background: var(--bad); color: #fff; }
.banner { padding: 10px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); }
.banner.info { background: var(--ink-soft); color: var(--ink); }

/* ---------- setup wizard ---------- */
.setup { max-width: 980px; margin: 0 auto; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
.setup h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); }
.ind-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.ind { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 14px; text-align: left; cursor: pointer; display: grid; gap: 4px; font: inherit; color: inherit; }
.ind .e { font-size: 24px; }
.ind .t { font-weight: 600; }
.ind .d { font-size: 12px; color: var(--muted); }
.ind.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink-soft); }

/* ---------- receipt ---------- */
.receipt { font: 13px/1.45 var(--font-data); background: #fff; color: #111; padding: 16px; border: 1px dashed #bbb; border-radius: 6px; max-width: 380px; margin: 0 auto; width: 100%; }
.receipt h3 { font-family: var(--font-data); text-align: center; font-size: 15px; }
.receipt .c { text-align: center; }
.receipt table td, .receipt table th { padding: 3px 0; border: 0; font-size: 12px; color: #111; }
.receipt hr { border: 0; border-top: 1px dashed #999; margin: 8px 0; }
.receipt .r { text-align: right; }

@media print {
  body * { visibility: hidden; }
  #print-area, #print-area * { visibility: visible; }
  #print-area { position: absolute; left: 0; top: 0; width: 100%; }
  .receipt { border: 0; max-width: none; }
}

            .some(function (v) { return v !== undefined && v !== null && String(v).toLowerCase().indexOf(needle) >= 0; });
        });
      }
      if (q.from) rows = rows.filter(function (r) { return (r.date || '') >= q.from; });
      if (q.to) rows = rows.filter(function (r) { return (r.date || '') <= q.to; });
      if (q.partyId) rows = rows.filter(function (r) { return r.customerId === q.partyId || r.supplierId === q.partyId || r.partyId === q.partyId; });
      if (q.itemId) rows = rows.filter(function (r) { return r.itemId === q.itemId; });
      if (q.status) rows = rows.filter(function (r) { return r.status === q.status; });
      if (q.category) rows = rows.filter(function (r) { return r.category === q.category; });
      if (col === 'items' && q.filter) {
        var warn = addDays(t, s.expiryWarnDays);
        rows = rows.filter(function (r) {
          if (q.filter === 'low') return r.trackStock && r.stock <= r.reorderLevel;
          if (q.filter === 'out') return r.trackStock && r.stock <= 0;
          if (q.filter === 'expiring') return r.expiry && r.expiry >= t && r.expiry <= warn && r.stock > 0;
          if (q.filter === 'expired') return r.expiry && r.expiry < t && r.stock > 0;
          if (q.filter === 'services') return r.isService;
          if (q.filter === 'products') return !r.isService;
          return true;
        });
      }
      if (col === 'customers' || col === 'suppliers') {
        if (q.filter === 'due') rows = rows.filter(function (r) { return r.balance > 0.004; });
      }
      var sortKey = q.sort || ({ items: 'name', customers: 'name', suppliers: 'name', staff: 'name' }[col] || '-at');
      var desc = sortKey[0] === '-'; if (desc) sortKey = sortKey.slice(1);
      rows.sort(function (a, b) {
        var va = a[sortKey], vb = b[sortKey];
        if (sortKey === 'at') { va = (a.date || '') + (a.time || '') + (a.createdAt || a.at || ''); vb = (b.date || '') + (b.time || '') + (b.createdAt || b.at || ''); }
        if (typeof va === 'number' && typeof vb === 'number') return desc ? vb - va : va - vb;
        va = String(va === undefined ? '' : va).toLowerCase(); vb = String(vb === undefined ? '' : vb).toLowerCase();
        return desc ? vb.localeCompare(va) : va.localeCompare(vb);
      });
      var total = rows.length;
      if (q.limit) rows = rows.slice(q.offset || 0, (q.offset || 0) + q.limit);
      return { rows: clone(rows), total: total };
    };

    api.get = function (col, id) {
      if (COLLECTIONS.indexOf(col) < 0) fail('Unknown collection ' + col);
      var d = find(col, id);
      return d ? clone(d) : null;
    };

    api.findItemByCode = function (code) {
      code = str(code).toLowerCase();
      if (!code) return null;
      var it = db.items.filter(function (i) { return i.active !== false && ((i.barcode && i.barcode.toLowerCase() === code) || (i.sku && i.sku.toLowerCase() === code)); })[0];
      return it ? clone(it) : null;

    api.save = function (col, input) {
      if (EDITABLE.indexOf(col) < 0) fail('Cannot edit ' + col + ' directly');
      return tx(function () {
        input = input || {};
        var existing = input.id ? find(col, input.id) : null;
        var doc;
        if (col === 'items') {
          var oldStock = existing ? existing.stock : 0;
          doc = normItem(input, existing);
          if (!existing) { db.items.push(doc); }
          touch('items', doc);
          if (input.stock !== undefined && input.stock !== '' && doc.trackStock) {
            var diff = r2(num(input.stock) - oldStock);
            if (diff) moveStock(doc, diff, existing ? 'adjust' : 'opening', '', existing ? 'Edited stock' : 'Opening stock');
          }
        } else if (col === 'customers' || col === 'suppliers') {
          doc = normParty(input, existing);
          if (!existing) {
            if (input.openingBalance) doc.balance = r2(num(input.openingBalance));
            db[col].push(doc);
          }
          touch(col, doc);
        } else if (col === 'staff') {
          if (!str(input.name)) fail('Name is required');
          doc = existing || { id: uid(), createdAt: stamp() };
          doc.name = str(input.name); doc.role = str(input.role); doc.phone = str(input.phone);
          doc.commissionRate = num(input.commissionRate); doc.salary = num(input.salary);
          doc.active = input.active === undefined ? true : !!input.active;
          if (!existing) db.staff.push(doc);
          touch('staff', doc);
        } else if (col === 'expenses') {
          if (num(input.amount) <= 0) fail('Amount must be more than zero');
          doc = existing || { id: uid(), createdAt: stamp() };
          doc.date = isDate(input.date) ? input.date : today();
          doc.category = str(input.category) || 'Other';
          doc.amount = r2(num(input.amount)); doc.method = str(input.method) || 'Cash';
          doc.note = str(input.note); doc.staffId = str(input.staffId);
          if (!existing) db.expenses.push(doc);
          touch('expenses', doc);
        } else if (col === 'appointments') {
          if (!isDate(input.date)) fail('Date is required');
          var cust = input.customerId ? find('customers', input.customerId) : null;
          if (!cust && !str(input.customerName)) fail('Customer name is required');
          doc = existing || { id: uid(), createdAt: stamp(), status: 'booked' };
          doc.date = input.date; doc.time = str(input.time) || '10:00';
          doc.customerId = cust ? cust.id : ''; doc.customerName = cust ? cust.name : str(input.customerName);
          doc.phone = cust ? cust.phone : str(input.phone);
          var svc = input.itemId ? find('items', input.itemId) : null;
          doc.itemId = svc ? svc.id : ''; doc.itemName = svc ? svc.name : str(input.itemName);
          doc.durationMin = num(input.durationMin) || (svc ? svc.durationMin : 30);
          doc.staffId = str(input.staffId); doc.notes = str(input.notes);
          if (input.status) doc.status = input.status;
          if (!existing) db.appointments.push(doc);
          touch('appointments', doc);
        }
        return clone(doc);
      });
    };

    api.remove = function (col, id) {
      if (EDITABLE.indexOf(col) < 0) fail('Cannot delete ' + col);
      return tx(function () {
        var d = mustFind(col, id);
        if ((col === 'customers' || col === 'suppliers') && Math.abs(d.balance) > 0.004) fail('Settle the balance before deleting');
        if (col === 'items' && (db.sales.some(function (s) { return s.lines.some(function (l) { return l.itemId === id; }); }) ||
          db.purchases.some(function (p) { return p.lines.some(function (l) { return l.itemId === id; }); }))) {
          // keep history intact: deactivate instead of deleting
          d.active = false; touch('items', d);
          return { deactivated: true };
        }
        db[col] = db[col].filter(function (x) { return x.id !== id; });
        drop(col, id);
        return { deleted: true };
      });
    };

    // ---------- Sales ----------
    api.quote = function (input) { return quote(input || {}); };

    api.createSale = function (input) {
      input = input || {};
      return tx(function () {
        var s = settings();
        var q = quote(input);
        if (!q.lines.length) fail('Add at least one item');
        var cust = input.customerId ? mustFind('customers', input.customerId, 'Customer') : null;
        var paid = input.paid === undefined || input.paid === '' ? q.total : r2(num(input.paid));
        if (paid < 0) fail('Paid amount cannot be negative');
        var change = 0;
        if (paid > q.total) { change = r2(paid - q.total); paid = q.total; }
        var due = r2(q.total - paid);
        if (due > 0.004 && !cust) fail('Select a customer to give credit (amount due ' + due + ')');

        // stock check first
        var need = {};
        q.lines.forEach(function (l) { if (l.itemId) need[l.itemId] = (need[l.itemId] || 0) + l.qty; });
        Object.keys(need).forEach(function (id) {
          var it = find('items', id);
          if (it.trackStock && !s.allowNegativeStock && it.stock < need[id]) fail('Not enough stock for ' + it.name + ' (available ' + it.stock + ')');
        });

        var sale = Object.assign({ id: uid(), number: nextNumber(s.invoicePrefix || 'INV-'), date: isDate(input.date) ? input.date : today(), at: stamp(),
          customerId: cust ? cust.id : '', customerName: cust ? cust.name : (str(input.customerName) || 'Walk-in'),
          customerPhone: cust ? cust.phone : str(input.customerPhone),
          staffId: str(input.staffId), method: str(input.method) || 'Cash', notes: str(input.notes),
          paid: paid, due: due, change: change, status: due > 0.004 ? (paid > 0 ? 'partial' : 'unpaid') : 'paid',
          appointmentId: str(input.appointmentId) }, q);
        q.lines.forEach(function (l) { if (l.itemId) moveStock(find('items', l.itemId), -l.qty, 'sale', sale.id, sale.number); });
        if (cust) {
          cust.balance = r2(cust.balance + due);
          if (s.loyaltyPercent > 0) { sale.pointsEarned = Math.floor(q.total * s.loyaltyPercent / 100); cust.points = (cust.points || 0) + sale.pointsEarned; }
          cust.lastVisit = sale.date; cust.totalSpent = r2((cust.totalSpent || 0) + q.total);
          touch('customers', cust);
        }
        if (paid > 0) {
          var pay = { id: uid(), date: sale.date, at: stamp(), direction: 'in', partyType: 'customer', partyId: sale.customerId, partyName: sale.customerName, amount: paid, method: sale.method, refId: sale.id, note: 'Against ' + sale.number };
          db.payments.push(pay); touch('payments', pay);
        }
        db.sales.push(sale); touch('sales', sale);
        return clone(sale);
      });
    };

    api.voidSale = function (id, reason) {
      return tx(function () {
        var sale = mustFind('sales', id, 'Sale');
        if (sale.status === 'void') fail('Already cancelled');
        sale.lines.forEach(function (l) { var it = l.itemId && find('items', l.itemId); if (it) moveStock(it, l.qty, 'void', sale.id, 'Cancelled ' + sale.number); });
        var cust = sale.customerId && find('customers', sale.customerId);
        if (cust) {
          cust.balance = r2(cust.balance - sale.due);
          if (sale.pointsEarned) cust.points = Math.max(0, (cust.points || 0) - sale.pointsEarned);
          cust.totalSpent = r2((cust.totalSpent || 0) - sale.total);
          touch('customers', cust);
        }
        if (sale.paid > 0) {
          var refund = { id: uid(), date: today(), at: stamp(), direction: 'out', partyType: 'customer', partyId: sale.customerId, partyName: sale.customerName, amount: sale.paid, method: sale.method, refId: sale.id, note: 'Refund for cancelled ' + sale.number };
          db.payments.push(refund); touch('payments', refund);
        }
        sale.status = 'void'; sale.voidReason = str(reason); sale.voidedAt = stamp(); sale.due = 0;
        touch('sales', sale);
        return clone(sale);
      });
    };

    // ---------- Purchases ----------
    api.createPurchase = function (input) {
      input = input || {};
      return tx(function () {
        var s = settings();
        var p = preset();
        var sup = input.supplierId ? mustFind('suppliers', input.supplierId, 'Supplier') : null;
        var lines = (input.lines || []).filter(function (l) { return l && (l.itemId || str(l.name)) && num(l.qty) > 0; });
        if (!lines.length) fail('Add at least one item with quantity');
        var pur = { id: uid(), number: nextNumber(s.purchasePrefix || 'PUR-'), date: isDate(input.date) ? input.date : today(), at: stamp(),
          supplierId: sup ? sup.id : '', supplierName: sup ? sup.name : (str(input.supplierName) || 'Cash purchase'),
          billNo: str(input.billNo), notes: str(input.notes), method: str(input.method) || 'Cash', lines: [], subtotal: 0, tax: 0, total: 0 };
        lines.forEach(function (l) {
          var it = l.itemId ? mustFind('items', l.itemId, 'Item') : null;
          var batch = str(l.batch);
          if (!it) {
            var nm = str(l.name).toLowerCase();
            it = db.items.filter(function (x) { return x.name.toLowerCase() === nm && (!p.flags.batch || (x.batch || '') === batch); })[0] || null;
          }
          if (!it) {
            it = normItem({ name: l.name, category: l.category, unit: l.unit, price: l.price || 0, cost: l.cost, batch: batch, expiry: l.expiry, taxRate: l.taxRate, barcode: l.barcode });
            db.items.push(it);
          }
          if (it.isService) fail(it.name + ' is a service and has no stock');
          var qty = num(l.qty), cost = r2(num(l.cost, it.cost));
          var free = num(l.free);
          var rate = l.taxRate === undefined || l.taxRate === '' || l.taxRate === null ? 0 : num(l.taxRate);
          var sub = r2(qty * cost), tax = r2(sub * rate / 100);
          it.cost = cost;
          if (num(l.price) > 0) it.price = r2(num(l.price));
          if (batch) it.batch = batch;
          if (isDate(l.expiry)) it.expiry = l.expiry;
          if (it.active === false) it.active = true;
          moveStock(it, qty + free, 'purchase', pur.id, pur.number);
          touch('items', it);
          pur.lines.push({ itemId: it.id, name: it.name, qty: qty, free: free, cost: cost, taxRate: rate, tax: tax, total: r2(sub + tax), batch: it.batch, expiry: it.expiry });
          pur.subtotal = r2(pur.subtotal + sub); pur.tax = r2(pur.tax + tax);
        });
        pur.total = r2(pur.subtotal + pur.tax - num(input.discount));
        var paid = input.paid === undefined || input.paid === '' ? pur.total : Math.min(pur.total, r2(num(input.paid)));
        pur.paid = paid; pur.due = r2(pur.total - paid);
        if (pur.due > 0.004 && !sup) fail('Select a supplier to record an unpaid amount');
        pur.status = pur.due > 0.004 ? (paid > 0 ? 'partial' : 'unpaid') : 'paid';
        if (sup) { sup.balance = r2(sup.balance + pur.due); touch('suppliers', sup); }
        if (paid > 0) {
          var pay = { id: uid(), date: pur.date, at: stamp(), direction: 'out', partyType: 'supplier', partyId: pur.supplierId, partyName: pur.supplierName, amount: paid, method: pur.method, refId: pur.id, note: 'Against ' + pur.number };
          db.payments.push(pay); touch('payments', pay);
        }
        db.purchases.push(pur); touch('purchases', pur);
        return clone(pur);
      });
    };

    api.voidPurchase = function (id, reason) {
      return tx(function () {
        var pur = mustFind('purchases', id, 'Purchase');
        if (pur.status === 'void') fail('Already cancelled');
        pur.lines.forEach(function (l) { var it = find('items', l.itemId); if (it) moveStock(it, -(l.qty + (l.free || 0)), 'void', pur.id, 'Cancelled ' + pur.number); });
        var sup = pur.supplierId && find('suppliers', pur.supplierId);
        if (sup) { sup.balance = r2(sup.balance - pur.due); touch('suppliers', sup); }
        if (pur.paid > 0) {
          var back = { id: uid(), date: today(), at: stamp(), direction: 'in', partyType: 'supplier', partyId: pur.supplierId, partyName: pur.supplierName, amount: pur.paid, method: pur.method, refId: pur.id, note: 'Return for cancelled ' + pur.number };
          db.payments.push(back); touch('payments', back);
        }
        pur.status = 'void'; pur.voidReason = str(reason); pur.due = 0; touch('purchases', pur);
        return clone(pur);
      });
    };

    // ---------- Stock ----------
    api.adjustStock = function (input) {
      return tx(function () {
        var it = mustFind('items', input.itemId, 'Item');
        if (!it.trackStock) fail('Stock is not tracked for services');
        var qty = num(input.qty);
        if (input.mode === 'set') qty = r2(num(input.qty) - it.stock);
        if (!qty) fail('No change in quantity');

        return clone(it);
      });

    // ---------- Payments (dues) ----------
    api.recordPayment = function (input) {
      return tx(function () {
        var type = input.partyType === 'supplier' ? 'supplier' : 'customer';
        var col = type + 's';
        var party = mustFind(col, input.partyId, type);

        if (amount <= 0) fail('Amount must be more than zero');
        party.balance = r2(party.balance - amount);
        touch(col, party);
        allocate(type === 'customer' ? 'sales' : 'purchases', type === 'customer' ? 'customerId' : 'supplierId', party.id, amount);
        var pay = { id: uid(), date: isDate(input.date) ? input.date : today(), at: stamp(), direction: type === 'customer' ? 'in' : 'out',
          partyType: type, partyId: party.id, partyName: party.name, amount: amount, method: str(input.method) || 'Cash', refId: '', note: str(input.note) || 'Due payment' };
        db.payments.push(pay); touch('payments', pay);
        return clone(party);
      });
    };

    api.ledger = function (partyType, id) {
      var type = partyType === 'supplier' ? 'supplier' : 'customer';

      var docs = db[type === 'customer' ? 'sales' : 'purchases'].filter(function (d) { return d[key] === id; });
      var pays = db.payments.filter(function (p) { return p.partyType === type && p.partyId === id; });
      return { party: clone(party), docs: clone(docs).sort(function (a, b) { return b.at.localeCompare(a.at); }),
        payments: clone(pays).sort(function (a, b) { return b.at.localeCompare(a.at); }) };

    // ---------- Dashboard & reports ----------
    api.dashboard = function () {
      var s = settings(), t = today(), month = t.slice(0, 7), warn = addDays(t, s.expiryWarnDays);
      var live = db.sales.filter(function (x) { return x.status !== 'void'; });
      function sum(arr, k) { return r2(arr.reduce(function (a, x) { return a + (x[k] || 0); }, 0)); }
      var todays = live.filter(function (x) { return x.date === t; });
      var monthSales = live.filter(function (x) { return x.date.slice(0, 7) === month; });
      var monthExp = db.expenses.filter(function (x) { return x.date.slice(0, 7) === month; });
      var activeItems = db.items.filter(function (i) { return i.active !== false; });
      var days = [];
      for (var i = 13; i >= 0; i--) {
        var d = addDays(t, -i);
        var ds = live.filter(function (x) { return x.date === d; });
        days.push({ date: d, total: sum(ds, 'total'), count: ds.length });
      }
      return {
        today: t,
        todaySales: sum(todays, 'total'), todayCount: todays.length, todayProfit: sum(todays, 'profit'),
        todayCollected: r2(db.payments.filter(function (p) { return p.date === t && p.direction === 'in'; }).reduce(function (a, p) { return a + p.amount; }, 0)),
        monthSales: sum(monthSales, 'total'), monthProfit: sum(monthSales, 'profit'), monthExpenses: sum(monthExp, 'amount'),
        monthNet: r2(sum(monthSales, 'profit') - sum(monthExp, 'amount')),
        receivables: r2(db.customers.reduce(function (a, c) { return a + Math.max(0, c.balance); }, 0)),
        payables: r2(db.suppliers.reduce(function (a, c) { return a + Math.max(0, c.balance); }, 0)),
        stockValue: r2(activeItems.reduce(function (a, i) { return a + (i.trackStock ? Math.max(0, i.stock) * i.cost : 0); }, 0)),
        itemCount: activeItems.length,
        lowStock: clone(activeItems.filter(function (i) { return i.trackStock && i.stock <= i.reorderLevel; }).sort(function (a, b) { return a.stock - b.stock; }).slice(0, 10)),
        lowStockCount: activeItems.filter(function (i) { return i.trackStock && i.stock <= i.reorderLevel; }).length,
        expiring: clone(activeItems.filter(function (i) { return i.expiry && i.expiry <= warn && i.stock > 0; }).sort(function (a, b) { return a.expiry.localeCompare(b.expiry); }).slice(0, 10)),
        appointments: clone(db.appointments.filter(function (a) { return a.date >= t && a.status !== 'cancelled' && a.status !== 'done'; })
          .sort(function (a, b) { return (a.date + a.time).localeCompare(b.date + b.time); }).slice(0, 8)),
        recentSales: clone(db.sales.slice().sort(function (a, b) { return b.at.localeCompare(a.at); }).slice(0, 6)),
        last14: days
      };
    };

    api.report = function (q) {
      q = q || {};
      var t = today();
      var from = isDate(q.from) ? q.from : t.slice(0, 8) + '01';
      var to = isDate(q.to) ? q.to : t;
      function inR(x) { return x.date >= from && x.date <= to; }
      var sales = db.sales.filter(function (x) { return x.status !== 'void' && inR(x); });
      var exps = db.expenses.filter(inR);
      var purs = db.purchases.filter(function (x) { return x.status !== 'void' && inR(x); });
      var pays = db.payments.filter(inR);
      function sum(arr, k) { return r2(arr.reduce(function (a, x) { return a + (x[k] || 0); }, 0)); }
      function group(arr, keyFn, valFn) {
        var m = {};
        arr.forEach(function (x) { var k = keyFn(x); if (!m[k]) m[k] = { key: k }; valFn(m[k], x); });
        return Object.keys(m).map(function (k) { return m[k]; });
      }
      var lines = [];
      sales.forEach(function (sl) { sl.lines.forEach(function (l) { lines.push(l); }); });
      var staffNames = {}; db.staff.forEach(function (st) { staffNames[st.id] = st; });
      var r = {
        from: from, to: to,
        salesCount: sales.length, salesTotal: sum(sales, 'total'), tax: sum(sales, 'tax'), net: sum(sales, 'net'),
        discount: r2(sum(sales, 'billDiscount') + sum(sales, 'lineDiscount')),
        cost: sum(sales, 'cost'), grossProfit: sum(sales, 'profit'), expenses: sum(exps, 'amount'),
        purchases: sum(purs, 'total'), creditGiven: sum(sales, 'due'),
        collected: r2(pays.filter(function (p) { return p.direction === 'in'; }).reduce(function (a, p) { return a + p.amount; }, 0)),
        paidOut: r2(pays.filter(function (p) { return p.direction === 'out'; }).reduce(function (a, p) { return a + p.amount; }, 0)
          + exps.reduce(function (a, e) { return a + e.amount; }, 0)),
        byDay: group(sales, function (x) { return x.date; }, function (g, x) { g.total = r2((g.total || 0) + x.total); g.profit = r2((g.profit || 0) + x.profit); g.count = (g.count || 0) + 1; })

  // ---------------------------------------------------------------- dashboard
  function barChart(days, valueKey) {
    var W = 640, H = 180, padL = 52, padB = 26, padT = 10;
    var max = Math.max.apply(null, days.map(function (d) { return d[valueKey]; }).concat([0]));
    var nice = niceMax(max);
    var bw = (W - padL - 8) / days.length;
    var g = '';
    [0, .5, 1].forEach(function (f) {
      var y = padT + (H - padT - padB) * (1 - f);
      g += '<line class="grid-line" x1="' + padL + '" x2="' + (W - 4) + '" y1="' + y + '" y2="' + y + '"></line>' +
        '<text x="' + (padL - 6) + '" y="' + (y + 3) + '" text-anchor="end">' + esc(short(nice * f)) + '</text>';
    });
    days.forEach(function (d, i) {
      var v = d[valueKey], h = nice ? (H - padT - padB) * v / nice : 0;
      var x = padL + i * bw + bw * .18, y = H - padB - h;
      g += '<rect class="bar' + (v ? '' : ' zero') + '" x="' + x.toFixed(1) + '" y="' + (v ? y : H - padB - 1).toFixed(1) + '" width="' + (bw * .64).toFixed(1) + '" height="' + (v ? Math.max(h, 1) : 1).toFixed(1) + '" rx="2"><title>' + esc(d.key || d.date) + ': ' + esc(money(v)) + '</title></rect>';
      if (days.length <= 16 || i % Math.ceil(days.length / 12) === 0) {
        g += '<text x="' + (x + bw * .32).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc((d.key || d.date).slice(8, 10)) + '</text>';
      }
    });
    return '<div class="bars"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Sales by day">' + g + '</svg></div>';
  }
  function niceMax(v) { if (v <= 0) return 0; var p = Math.pow(10, Math.floor(Math.log10(v))); var n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
  function short(v) { return v >= 1e7 ? (v / 1e7).toFixed(1) + 'Cr' : v >= 1e5 ? (v / 1e5).toFixed(1) + 'L' : v >= 1000 ? (v / 1000).toFixed(v >= 1e4 ? 0 : 1) + 'k' : String(Math.round(v)); }

  // ---------------------------------------------------------------- POS
  var cart = { lines: [], customerId: '', staffId: '', discount: 0, method: 'Cash', paid: '', notes: '', appointmentId: '' };
  PAGES.pos = function (view) {
    setTitle('New ' + label('sale').toLowerCase());
    return Promise.all([api.call('list', 'items', { sort: 'name' }), api.call('list', 'customers', {}), api.call('list', 'staff', {})]).then(function (res) {
      var items = res[0].rows.filter(function (i) { return i.active !== false; });
      var customers = res[1].rows, staff = res[2].rows.filter(function (s) { return s.active !== false; });
      var cats = Array.from(new Set(items.map(function (i) { return i.category; }).filter(Boolean)));
      var filter = { q: '', cat: '' };
      view.innerHTML = '<div class="pos"><div class="panel stack"><div class="row"><input id="pos-search" class="search" style="max-width:none;flex:1" placeholder="Search ' + esc(label('items').toLowerCase()) + ' or scan barcode, then Enter" autocomplete="off"></div>' +
        '<div class="chips" id="pos-cats"><button type="button" class="chip on" data-cat="">All</button>' + cats.map(function (c) { return '<button type="button" class="chip" data-cat="' + esc(c) + '">' + esc(c) + '</button>'; }).join('') + '</div>' +
        '<div class="catalog" id="pos-catalog"></div></div>' +
        '<div class="panel cart" id="pos-cart"></div></div>';
      function drawCatalog() {
        var q = filter.q.toLowerCase();
        var list = items.filter(function (i) {
          return (!filter.cat || i.category === filter.cat) && (!q || [i.name, i.sku, i.barcode, i.batch].concat(Object.values(i.custom || {})).join(' ').toLowerCase().indexOf(q) >= 0);
        }).slice(0, 120);
        $('#pos-catalog').innerHTML = list.length ? list.map(function (i) {
          var out = i.trackStock && i.stock <= 0;
          return '<button type="button" class="prod' + (out ? ' out' : '') + '" data-add="' + i.id + '"><span class="n">' + esc(i.name) + '</span><span class="p">' + esc(money(i.price)) + '</span>' +
            '<span class="s">' + (i.isService ? 'service' : (out ? 'out of stock' : qtyFmt(i.stock) + ' ' + esc(i.unit))) + (i.batch ? ' · ' + esc(i.batch) : '') + (i.expiry ? ' · exp ' + esc(i.expiry.slice(0, 7)) : '') + '</span></button>';
        }).join('') : emptyState('Nothing found', items.length ? 'Try another search.' : 'Add your ' + label('items').toLowerCase() + ' first.', '<a class="btn sm" href="#items">Go to ' + esc(label('items')) + '</a>');
        $$('[data-add]', view).forEach(function (b) { b.onclick = function () { add(b.getAttribute('data-add')); }; });
      }
      function add(id) {
        var it = items.filter(function (i) { return i.id === id; })[0]; if (!it) return;
        var ex = cart.lines.filter(function (l) { return l.itemId === id; })[0];
        if (ex) ex.qty = Number(ex.qty) + 1; else cart.lines.push({ itemId: id, name: it.name, qty: 1, price: it.price, discount: 0, stock: it.stock, trackStock: it.trackStock, unit: it.unit });
        drawCart();
      }
      function drawCart() {
        var custOpts = customers.map(function (c) { return { value: c.id, text: c.name + (c.phone ? ' · ' + c.phone : '') + (c.balance > 0 ? ' (due ' + money(c.balance) + ')' : '') }; });
        var el = $('#pos-cart');
        el.innerHTML = '<div class="panel-head"><h2>' + esc(label('sale')) + '</h2>' + (cart.lines.length ? '<button type="button" class="btn sm ghost" id="cart-clear">Clear</button>' : '') + '</div>' +
          (cart.lines.length ? '<div>' + cart.lines.map(function (l, idx) {
            var warn = l.trackStock && Number(l.qty) > l.stock;
            return '<div class="cart-line"><div class="nm">' + esc(l.name) + '<div class="sub">' + esc(money(l.price)) + ' / ' + esc(l.unit) + (warn ? ' · <span style="color:var(--bad)">only ' + qtyFmt(l.stock) + ' left</span>' : '') + '</div></div>' +
              '<input type="number" step="any" min="0" value="' + esc(l.qty) + '" data-qty="' + idx + '" aria-label="Quantity">' +
              '<input type="number" step="any" min="0" value="' + esc(l.price) + '" data-price="' + idx + '" aria-label="Price">' +
              '<button type="button" class="btn ghost sm" data-del="' + idx + '" aria-label="Remove">✕</button></div>';
          }).join('') + '</div>' : emptyState('No items yet', 'Tap a ' + label('item').toLowerCase() + ' or scan a barcode.')) +
          '<div class="form-grid" style="margin-top:12px">' +
          '<label class="field">' + esc(label('customer')) + '<select id="cart-cust"><option value="">Walk-in</option>' + opt(custOpts, cart.customerId) + '</select></label>' +
          (has('staff') && staff.length ? '<label class="field">Served by<select id="cart-staff">' + opt(staff.map(function (s) { return { value: s.id, text: s.name }; }), cart.staffId, '—') + '</select></label>' : '') +
          '<label class="field">Bill discount<input type="number" step="any" min="0" id="cart-disc" value="' + esc(cart.discount || '') + '" placeholder="0"></label>' +
          '<label class="field">Payment<select id="cart-method">' + opt(INFO.paymentMethods, cart.method) + '</select></label>' +
          '<label class="field">Amount received<input type="number" step="any" min="0" id="cart-paid" value="' + esc(cart.paid) + '" placeholder="Full amount"></label>' +
          '</div><div class="row" style="margin-top:6px"><button type="button" class="btn sm ghost" id="cart-newcust">＋ New ' + esc(label('customer').toLowerCase()) + '</button></div>' +
          '<div class="totals" id="cart-totals"></div>' +
          '<button type="button" class="btn primary big" id="cart-go" style="margin-top:12px"' + (cart.lines.length ? '' : ' disabled') + '>Complete ' + esc(label('sale').toLowerCase()) + '</button>';
        $$('[data-qty]', el).forEach(function (i) { i.oninput = function () { cart.lines[+i.dataset.qty].qty = i.value; updateTotals(); }; i.onchange = drawCart; });
        $$('[data-price]', el).forEach(function (i) { i.oninput = function () { cart.lines[+i.dataset.price].price = i.value; updateTotals(); }; });
        $$('[data-del]', el).forEach(function (b) { b.onclick = function () { cart.lines.splice(+b.dataset.del, 1); drawCart(); }; });

        $('#cart-paid', el).oninput = function (e) { cart.paid = e.target.value; updateTotals(); };

      var updateTotals = debounce(function () {

            '<div class="grand"><span>Total</span><span>' + esc(money(q.total)) + '</span></div>';
          if (paid > q.total) rows += '<div><span>Change to return</span><b>' + esc(money(paid - q.total)) + '</b></div>';
          else if (paid < q.total) rows += '<div style="color:var(--bad)"><span>Due (credit)</span><b>' + esc(money(q.total - paid)) + '</b></div>';
          box.innerHTML = rows;
        }).catch(function () { });

      function resetCart() { cart = { lines: [], customerId: '', staffId: '', discount: 0, method: 'Cash', paid: '', notes: '', appointmentId: '' }; }
      function checkout() {
        var payload = { lines: cart.lines.map(function (l) { return { itemId: l.itemId, qty: l.qty, price: l.price, discount: l.discount }; }),
          customerId: cart.customerId, staffId: cart.staffId, discount: cart.discount, method: cart.method, paid: cart.paid };
        api.call('createSale', payload).then(function (sale) {
          resetCart();
          toast(label('sale') + ' ' + sale.number + ' saved');
          showSale(sale.id, true);
          PAGES.pos(view);
        }).catch(fail);
      }
      var search = $('#pos-search');
      search.oninput = debounce(function () { filter.q = search.value; drawCatalog(); }, 100);
      search.onkeydown = function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        var code = search.value.trim(); if (!code) return;
        var exact = items.filter(function (i) { return (i.barcode && i.barcode === code) || (i.sku && i.sku.toLowerCase() === code.toLowerCase()); })[0];
        var hits = exact ? [exact] : items.filter(function (i) { return i.name.toLowerCase().indexOf(code.toLowerCase()) >= 0; });
        if (hits.length === 1 || exact) { add(hits[0].id); search.value = ''; filter.q = ''; drawCatalog(); }
        else if (!hits.length) toast('No ' + label('item').toLowerCase() + ' matches "' + code + '"', true);
      };
      $$('[data-cat]', view).forEach(function (b) { b.onclick = function () { filter.cat = b.dataset.cat; $$('[data-cat]', view).forEach(function (x) { x.classList.toggle('on', x === b); }); drawCatalog(); }; });
      drawCatalog(); drawCart();
      setTimeout(function () { search.focus(); }, 50);
    });
  };

  // ---------------------------------------------------------------- generic list page helper
  function listPage(view, cfg) {
    var state = { search: '', filter: cfg.defaultFilter || '', from: cfg.dates ? cfg.from || '' : '', to: '' };
    view.innerHTML = '<div class="panel"><div class="panel-head"><input class="search" id="lp-search" placeholder="Search…" autocomplete="off">' +
      (cfg.filters ? '<div class="chips" id="lp-filters">' + cfg.filters.map(function (f) { return '<button type="button" class="chip' + (f.key === state.filter ? ' on' : '') + '" data-f="' + f.key + '">' + esc(f.text) + '</button>'; }).join('') + '</div>' : '') +
      (cfg.dates ? '<div class="row"><input type="date" id="lp-from" style="width:auto" aria-label="From"><input type="date" id="lp-to" style="width:auto" aria-label="To"></div>' : '') +
      '<span class="spacer"></span>' + (cfg.actions || '') + '</div><div id="lp-summary"></div><div class="table-wrap" id="lp-table"></div></div>';
    function load() {
      var q = { search: state.search, filter: state.filter, from: state.from, to: state.to, sort: cfg.sort };
      if (cfg.statusFilter && state.filter) { q.status = state.filter; delete q.filter; }
      return api.call('list', cfg.col, q).then(function (res) {
        var rows = res.rows;
        if (!$('#lp-table', view)) return; // user moved to another page meanwhile
        if (cfg.summary) $('#lp-summary', view).innerHTML = cfg.summary(rows);
        $('#lp-table', view).innerHTML = rows.length ? '<table><thead><tr>' + cfg.columns.map(function (c) { return '<th class="' + (c.num ? 'num' : '') + '">' + esc(c.title) + '</th>'; }).join('') + '<th></th></tr></thead><tbody>' +
          rows.slice(0, 500).map(function (r) {
            return '<tr class="' + (cfg.onRow ? 'clickable' : '') + '" data-id="' + r.id + '">' + cfg.columns.map(function (c) { return '<td class="' + (c.num ? 'num' : '') + '">' + c.cell(r) + '</td>'; }).join('') +
              '<td class="actions">' + (cfg.rowActions ? cfg.rowActions(r) : '') + '</td></tr>';
          }).join('') + '</tbody></table>' + (rows.length > 500 ? '<p class="muted">Showing first 500 of ' + rows.length + '. Use search to narrow.</p>' : '')
          : emptyState(cfg.emptyTitle || 'Nothing here yet', state.search || state.filter ? 'Try clearing the search or filter.' : (cfg.emptyHint || ''), cfg.emptyAction || '');
        $$('[data-proxy]', view).forEach(function (b) { b.onclick = function () { var t = document.getElementById(b.dataset.proxy); if (t) t.click(); }; });
        $$('tr[data-id]', view).forEach(function (tr) {
          if (cfg.onRow) tr.onclick = function (e) { if (e.target.closest('button,a')) return; cfg.onRow(rows.filter(function (r) { return r.id === tr.dataset.id; })[0]); };
        });
        $$('[data-act]', view).forEach(function (b) {
          b.onclick = function (e) { e.stopPropagation(); var r = rows.filter(function (x) { return x.id === b.closest('tr').dataset.id; })[0]; cfg.onAction(b.dataset.act, r, load); };
        });
        if (cfg.afterLoad) cfg.afterLoad(rows, load);
      });
    }
    $('#lp-search', view).oninput = debounce(function (e) { state.search = e.target.value; load(); }, 200);
    $$('[data-f]', view).forEach(function (b) { b.onclick = function () { state.filter = b.dataset.f; $$('[data-f]', view).forEach(function (x) { x.classList.toggle('on', x === b); }); load(); }; });
    if (cfg.dates) {
      $('#lp-from', view).value = state.from;
      $('#lp-from', view).onchange = function (e) { state.from = e.target.value; load(); };
      $('#lp-to', view).onchange = function (e) { state.to = e.target.value; load(); };
    }
    if (cfg.bind) cfg.bind(view, load);
    return load();
  }

          '<label class="field">Amount paid now<input type="number" step="any" min="0" name="paid" id="pu-paid" placeholder="Full amount"></label>' +
          '<label class="field">Paid by<select name="method" id="pu-method">' + opt(INFO.paymentMethods.filter(function (x) { return x !== 'Credit'; })) + '</select></label></div>' +
          '<div class="row"><label class="btn" for="pu-ai-file">📷 Read bill photo with AI</label><input type="file" id="pu-ai-file" accept="image/*,application/pdf" hidden><span class="muted" id="pu-ai-status">Fills the lines below for you to check.</span></div>' +

          '<div class="table-wrap"><table><thead><tr>' + hdr + '</tr></thead><tbody id="pu-lines"></tbody></table></div>' +
          '<div class="row"><button type="button" class="btn sm" id="pu-add">＋ Add line</button><span class="spacer"></span><b id="pu-total"></b></div>',
        onSubmit: function (d) {
          var payload = { supplierId: d.supplierId, billNo: d.billNo, date: d.date, paid: d.paid, method: d.method, lines: lines.filter(function (l) { return l.name && Number(l.qty) > 0; }) };
          payload.lines.forEach(function (l) { var it = items.filter(function (i) { return i.name.toLowerCase() === l.name.toLowerCase() && (!f.batch || !l.batch || i.batch === l.batch); })[0]; if (it && (!f.batch || it.batch === l.batch || !l.batch)) l.itemId = it.id; else delete l.itemId; });
          return api.call('createPurchase', payload).then(function (p) { toast('Purchase ' + p.number + ' saved · stock updated'); if (after) after(); });
        } });
      var tb = $('#pu-lines', m.form);
      function inp(i, k, type, w) { return '<td><input data-l="' + i + '" data-k="' + k + '" type="' + type + '" step="any" value="' + esc(lines[i][k]) + '" style="min-width:' + w + 'px"' + (k === 'name' ? ' list="pu-items"' : '') + '></td>'; }
      function draw() {
        tb.innerHTML = lines.map(function (l, i) {
          return '<tr>' + inp(i, 'name', 'text', 180) + inp(i, 'qty', 'number', 64) + inp(i, 'free', 'number', 56) + inp(i, 'cost', 'number', 80) + inp(i, 'price', 'number', 80) +
            (f.batch ? inp(i, 'batch', 'text', 90) : '') + (f.expiry ? inp(i, 'expiry', 'date', 130) : '') + inp(i, 'taxRate', 'number', 56) +
            '<td><button type="button" class="btn ghost sm" data-rm="' + i + '" aria-label="Remove line">✕</button></td></tr>';
        }).join('');
        $$('input[data-l]', tb).forEach(function (el) {
          el.oninput = function () {
            var l = lines[+el.dataset.l]; l[el.dataset.k] = el.value;
            if (el.dataset.k === 'name') {
              var it = items.filter(function (x) { return x.name.toLowerCase() === el.value.toLowerCase(); })[0];
              if (it && !l.cost) { l.cost = it.cost; l.price = it.price; l.batch = l.batch || ''; draw(); var again = $('input[data-l="' + el.dataset.l + '"][data-k="qty"]', tb); if (again) again.focus(); return; }
            }
            total();
          };
        });
        $$('[data-rm]', tb).forEach(function (b) { b.onclick = function () { lines.splice(+b.dataset.rm, 1); if (!lines.length) lines.push(blank()); draw(); }; });
        total();
      }
      function blank() { return { name: '', qty: '', free: '', cost: '', price: '', batch: '', expiry: '', taxRate: '' }; }
      function total() {
        var t = lines.reduce(function (a, l) { return a + (Number(l.qty) || 0) * (Number(l.cost) || 0) * (1 + (Number(l.taxRate) || 0) / 100); }, 0);
        $('#pu-total', m.form).textContent = 'Total ' + money(t);
      }
      $('#pu-add', m.form).onclick = function () { lines.push(blank()); draw(); };
      $('#pu-ai-file', m.form).onchange = function (e) {

        readFile(file, true).then(function (dataUrl) {

          lines = lines.filter(function (l) { return l.name; }).concat(got.map(function (g) { return { name: g.name, qty: g.qty, free: g.free || '', cost: g.cost, price: g.price || '', batch: g.batch, expiry: g.expiry, taxRate: g.taxRate || '' }; }));
          draw(); st.textContent = 'Read ' + got.length + ' lines. Check them before saving.';
        }).catch(function (err) { st.textContent = err.message; });
      };
      lines.push(blank()); draw();
    }).catch(fail);

  function readBillAI(base64, mimeType) {

    }
    var key = lsGet(LS_AIKEY);
    if (!key) return Promise.reject(new Error('Add a Google Gemini API key in Settings → AI bill reading to use this.'));
    return AI.readBill(window.fetch.bind(window), { apiKey: key, model: S.geminiModel, base64: base64, mimeType: mimeType, presetName: P.name, itemLabel: P.labels.item });

    view.innerHTML = '<div class="panel"><div class="panel-head"><div class="chips" id="rp-ranges">' +
      [['today', 'Today'], ['week', 'Last 7 days'], ['month', 'This month'], ['lastmonth', 'Last month'], ['year', 'This year']].map(function (r) { return '<button type="button" class="chip' + (r[0] === 'month' ? ' on' : '') + '" data-r="' + r[0] + '">' + r[1] + '</button>'; }).join('') +
      '</div><div class="row"><input type="date" id="rp-from" style="width:auto" aria-label="From"><input type="date" id="rp-to" style="width:auto" aria-label="To"></div></div></div><div id="rp-body" class="grid"></div>';
    function table(title, rows, cols) {
      return '<div class="panel"><div class="panel-head"><h2>' + esc(title) + '</h2></div>' + (rows.length ? '<div class="table-wrap"><table><thead><tr>' + cols.map(function (c) { return '<th class="' + (c[2] ? 'num' : '') + '">' + esc(c[0]) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        rows.map(function (r) { return '<tr>' + cols.map(function (c) { var v = r[c[1]]; return '<td class="' + (c[2] ? 'num' : '') + '">' + esc(c[2] === 'm' ? money(v) : c[2] === 'q' ? qtyFmt(v) : v) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>' : emptyState('No data for this period')) + '</div>';
    }
    function load() {
      $('#rp-from').value = cur[0]; $('#rp-to').value = cur[1];
      return api.call('report', { from: cur[0], to: cur[1] }).then(function (r) {
        if (!$('#rp-body')) return;
        var tiles = [['Sales', r.salesTotal, r.salesCount + (r.salesCount === 1 ? ' bill' : ' bills')], ['Gross profit', r.grossProfit, 'sales minus cost, excl. tax'], ['Expenses', r.expenses, ''], ['Net profit', r.netProfit, 'gross profit − expenses'],
          [S.taxLabel + ' collected', r.tax, ''], ['Discounts given', r.discount, ''], ['Money in', r.collected, 'all receipts'], ['Money out', r.paidOut, 'suppliers, refunds, expenses']];
        if (has('purchases')) tiles.push(['Purchases', r.purchases, '']);
        tiles.push(['Credit given', r.creditGiven, 'still unpaid on these bills']);
        var days = [], d = r.from, map = {};
        r.byDay.forEach(function (x) { map[x.key] = x; });
        if (Engine.daysBetween(r.from, r.to) <= 62) { while (d <= r.to) { days.push({ key: d, total: map[d] ? map[d].total : 0 }); d = Engine.addDays(d, 1); } }
        var html = '<div class="tiles">' + tiles.map(function (x) { return '<div class="tile' + (x[0] === 'Net profit' && x[1] < 0 ? ' danger' : '') + '"><span class="label">' + esc(x[0]) + '</span><span class="value">' + esc(money(x[1])) + '</span><span class="hint">' + esc(x[2]) + '</span></div>'; }).join('') + '</div>';
        if (days.length > 1) html += '<div class="panel"><div class="panel-head"><h2>Sales by day</h2></div>' + barChart(days, 'total') + '</div>';
        html += '<div class="grid grid-2">' +
          table('Top ' + label('items').toLowerCase(), r.byItem.slice(0, 25), [['Name', 'key'], ['Qty', 'qty', 'q'], ['Sales', 'total', 'm'], ['Profit', 'profit', 'm']]) +
          table('By category', r.byCategory, [['Category', 'key'], ['Qty', 'qty', 'q'], ['Sales', 'total', 'm']]) +
          table('Money received by method', r.byMethod, [['Method', 'key'], ['Count', 'count', 'q'], ['Amount', 'total', 'm']]) +
          table(S.taxLabel + ' summary', r.byTaxRate, [['Rate', 'key'], ['Taxable', 'taxable', 'm'], [S.taxLabel, 'tax', 'm']]) +
          (r.byStaff.length ? table('Staff performance', r.byStaff, [['Staff', 'name'], ['Bills', 'count', 'q'], ['Sales', 'total', 'm'], ['Commission', 'commission', 'm']]) : '') +
          table('Expenses by category', r.expensesByCategory, [['Category', 'key'], ['Amount', 'total', 'm']]) + '</div>';
        $('#rp-body').innerHTML = html;
      });
    }
    $$('[data-r]', view).forEach(function (b) { b.onclick = function () { cur = ranges[b.dataset.r]; $$('[data-r]', view).forEach(function (x) { x.classList.toggle('on', x === b); }); load().catch(fail); }; });
    $('#rp-from').onchange = function (e) { cur = [e.target.value, cur[1]]; $$('[data-r]', view).forEach(function (x) { x.classList.remove('on'); }); load().catch(fail); };
    $('#rp-to').onchange = function (e) { cur = [cur[0], e.target.value]; $$('[data-r]', view).forEach(function (x) { x.classList.remove('on'); }); load().catch(fail); };
    return load();
  };

  // ---------------------------------------------------------------- settings
  PAGES.prefs = function (view) {
    setTitle('Settings');
    var modNames = { dashboard: 'Dashboard', pos: 'New sale (billing)', sales: 'Sales list', items: label('items'), purchases: 'Purchases', customers: label('customers'), suppliers: 'Suppliers',
      expenses: 'Expenses', appointments: (P.appointmentLabel || 'Appointment') + 's', staff: 'Staff', reports: 'Reports', settings: 'Settings', data: 'Backup & data' };
    view.innerHTML = '<form class="panel stack" id="pf"><div class="panel-head"><h2>Business details</h2></div><div class="form-grid">' +
      '<label class="field">Business name<input name="businessName" id="pf-name" value="' + esc(S.businessName) + '"></label>' +
      '<label class="field">Phone<input name="phone" id="pf-phone" value="' + esc(S.phone) + '"></label>' +
      '<label class="field">Email<input name="email" id="pf-email" value="' + esc(S.email) + '"></label>' +
      '<label class="field wide">Address<input name="address" id="pf-addr" value="' + esc(S.address) + '"></label>' +
      '<label class="field">Type of business<select name="industry" id="pf-ind">' + opt(INFO.industries.map(function (i) { return { value: i.key, text: i.icon + ' ' + i.name }; }), S.industry) + '</select></label>' +
      '</div><div class="panel-head" style="margin-top:8px"><h2>Money & tax</h2></div><div class="form-grid">' +
      '<label class="field">Currency symbol<input name="currency" id="pf-cur" value="' + esc(S.currency) + '"></label>' +
      '<label class="field">Number format (locale)<input name="locale" id="pf-loc" value="' + esc(S.locale) + '" placeholder="en-IN, en-US, en-GB…"></label>' +
      '<label class="field">Phone country code<input name="countryCode" id="pf-cc" value="' + esc(S.countryCode || '91') + '"></label>' +
      '<label class="field">Tax name<input name="taxLabel" id="pf-taxl" value="' + esc(S.taxLabel) + '" placeholder="GST, VAT, Sales tax"></label>' +
      '<label class="field">Default tax %<input type="number" step="any" name="taxRate" id="pf-tax" value="' + esc(S.taxRate) + '"></label>' +
      '<label class="field">Your tax number<input name="taxId" id="pf-taxid" value="' + esc(S.taxId) + '"></label>' +
      '<label class="check"><input type="checkbox" name="taxInclusive" id="pf-incl"' + (S.taxInclusive ? ' checked' : '') + '> Prices already include tax</label>' +
      '</div><div class="panel-head" style="margin-top:8px"><h2>Billing & stock</h2></div><div class="form-grid">' +
      '<label class="field">Bill number prefix<input name="invoicePrefix" id="pf-ip" value="' + esc(S.invoicePrefix) + '"></label>' +
      '<label class="field">Purchase number prefix<input name="purchasePrefix" id="pf-pp" value="' + esc(S.purchasePrefix) + '"></label>' +
      '<label class="field">Default reorder level<input type="number" name="lowStockDefault" id="pf-low" value="' + esc(S.lowStockDefault) + '"></label>' +
      '<label class="field">Warn before expiry (days)<input type="number" name="expiryWarnDays" id="pf-exp" value="' + esc(S.expiryWarnDays) + '"></label>' +
      '<label class="field">Loyalty points (% of bill)<input type="number" step="any" name="loyaltyPercent" id="pf-loy" value="' + esc(S.loyaltyPercent) + '"></label>' +
      '<label class="field wide">Receipt footer<input name="receiptFooter" id="pf-foot" value="' + esc(S.receiptFooter) + '"></label>' +
      '<label class="check"><input type="checkbox" name="allowNegativeStock" id="pf-neg"' + (S.allowNegativeStock ? ' checked' : '') + '> Allow selling more than the stock shown</label>' +
      '</div><div class="panel-head" style="margin-top:8px"><h2>Screens</h2><span class="muted">Turn off what you do not need</span></div><div class="form-grid">' +
      INFO.allModules.filter(function (m) { return m !== 'settings'; }).map(function (m) { return '<label class="check"><input type="checkbox" data-mod="' + m + '" id="pf-m-' + m + '"' + (has(m) ? ' checked' : '') + '> ' + esc(modNames[m] || m) + '</label>'; }).join('') +
      '</div><div class="panel-head" style="margin-top:8px"><h2>AI bill reading</h2></div>' +
      (api.mode === 'remote' ? '<p class="muted">' + (api.health && api.health.ai ? 'Enabled on the server.' : 'Set GOOGLE_API_KEY on the server to turn this on.') + '</p>'
        : '<div class="form-grid"><label class="field">Google Gemini API key (kept on this device only)<input type="password" id="pf-aikey" autocomplete="off" value="' + esc(lsGet(LS_AIKEY) || '') + '"></label>' +
          '<label class="field">Model<input name="geminiModel" id="pf-model" value="' + esc(S.geminiModel) + '"></label></div>') +
      '<div class="row"><button class="btn primary" type="submit">Save settings</button><span class="muted" id="pf-msg"></span></div></form>';
    $('#pf').onsubmit = function (e) {
      e.preventDefault();
      var d = formData(e.target);
      d.modules = $$('[data-mod]', view).filter(function (c) { return c.checked; }).map(function (c) { return c.dataset.mod; }).concat(['settings']);
      var indChanged = d.industry !== S.industry;
      var key = $('#pf-aikey'); if (key) { if (key.value) lsSet(LS_AIKEY, key.value.trim()); else lsDel(LS_AIKEY); }
      var go2 = indChanged ? confirmBox('Switch to ' + Industries.get(d.industry).name + '? Your data stays. Screens, words and fields change, and the screens list resets to that type’s default.', 'Switch') : Promise.resolve(true);
      go2.then(function (ok) {
        if (!ok) return;
        if (indChanged) { d.modules = Industries.get(d.industry).modules; d.taxRate = Industries.get(d.industry).taxRate; }
        return api.call('saveSettings', d).then(refreshInfo).then(function () { shell(); render(); toast('Settings saved'); });
      }).catch(fail);
    };
  };

  // ---------------------------------------------------------------- data
  function exportCSV(col) {
    api.call('exportCSV', col).then(function (csv) { download(col + '-' + today() + '.csv', '﻿' + csv, 'text/csv'); }).catch(fail);
  }
  function importCSVDialog(col, after) {
    var cols = { items: 'name, price, cost, stock, category, unit, barcode, sku, taxRate, reorderLevel, batch, expiry, isService' + (P.itemFields.length ? ', ' + P.itemFields.map(function (f) { return f.label; }).join(', ') : ''), customers: 'name, phone, email, address, balance', suppliers: 'name, phone, email, address, balance' }[col];
    modal({ title: 'Import ' + col + ' from CSV', wide: true, submitText: 'Import',
      body: '<p class="muted">First row must be column names. Recognised columns: ' + esc(cols) + '. Rows with the same name' + (col === 'items' ? ' (and batch)' : ' and phone') + ' are updated, others are added. Export from Excel or Google Sheets as CSV.</p>' +
        '<input type="file" accept=".csv,text/csv" id="csv-file"><label class="field">…or paste CSV text<textarea name="text" id="csv-text" placeholder="name,price,stock&#10;Example item,100,10"></textarea></label>',
      onOpen: function (f) { $('#csv-file', f).onchange = function (e) { var file = e.target.files[0]; if (file) readFile(file).then(function (t) { $('#csv-text', f).value = t; }); }; },
      onSubmit: function (d) { return api.call('importCSV', col, d.text).then(function (r) { toast('Added ' + r.created + ', updated ' + r.updated + (r.skipped ? ', skipped ' + r.skipped : '')); if (after) after(); }); } });
  }
  PAGES.data = function (view) {
    setTitle('Backup & data');
    var exportables = ['items', 'customers', 'suppliers', 'sales', 'purchases', 'payments', 'expenses', 'appointments', 'staff', 'stockMoves'];
    var names = { items: label('items'), customers: label('customers'), sales: label('sale') + 's', stockMoves: 'Stock movements' };
    view.innerHTML = '<div class="grid grid-2">' +
      '<div class="panel stack"><h2>Where your data lives</h2>' +
      (api.mode === 'remote' ? '<p>Shared mode: data is saved on your BizCore server' + (api.health && api.health.sync && api.health.sync.enabled ? ' and copied to Supabase (' + (api.health.sync.pending ? api.health.sync.pending + ' changes waiting to sync' : 'up to date') + ')' : '') + '. Every phone or computer that opens this address sees the same data. The server also keeps a daily backup copy for 14 days.</p>'
        : '<p>This-device mode: data is saved in this browser only. Download a backup regularly, or run the BizCore server to share data across devices.</p>' + (api.storageOk ? '' : '<p class="banner">This browser is not saving data right now (private window or storage blocked).</p>')) +
      '<div class="row"><button type="button" class="btn primary" id="dt-backup">Download full backup</button><button type="button" class="btn" id="dt-restore">Restore from backup</button></div></div>' +
      '<div class="panel stack"><h2>Spreadsheets (CSV)</h2><p class="muted">Open these in Excel or Google Sheets.</p><div class="chips">' +
      exportables.map(function (c) { return '<button type="button" class="chip" data-csv="' + c + '">' + esc(names[c] || (c.charAt(0).toUpperCase() + c.slice(1))) + '</button>'; }).join('') + '</div>' +
      '<div class="row"><button type="button" class="btn" data-imp="items">Import ' + esc(label('items').toLowerCase()) + '</button><button type="button" class="btn" data-imp="customers">Import ' + esc(label('customers').toLowerCase()) + '</button><button type="button" class="btn" data-imp="suppliers">Import suppliers</button></div></div>' +
      '<div class="panel stack"><h2>Example data</h2><p class="muted">Adds a few sample ' + esc(label('items').toLowerCase()) + ', a customer, a supplier and a staff member for this business type.</p><div><button type="button" class="btn" id="dt-samples">Add example data</button></div></div>' +
      '<div class="panel stack"><h2>Start over</h2><p class="muted">Deletes every record. Download a backup first.</p><div class="row"><button type="button" class="btn danger" id="dt-reset">Erase all data</button></div></div></div>';
    $('#dt-backup').onclick = function () { api.call('exportAll').then(function (db) { download('bizcore-backup-' + today() + '.json', JSON.stringify(db), 'application/json'); }).catch(fail); };
    $('#dt-restore').onclick = function () {
      modal({ title: 'Restore from backup', wide: true, submitText: 'Restore', danger: true,
        body: '<p class="banner">This replaces everything currently saved with the backup.</p><input type="file" accept=".json,application/json" id="rs-file"><label class="field">…or paste backup text<textarea name="text" id="rs-text"></textarea></label>',
        onOpen: function (f) { $('#rs-file', f).onchange = function (e) { var file = e.target.files[0]; if (file) readFile(file).then(function (t) { $('#rs-text', f).value = t; }); }; },
        onSubmit: function (d) {
          var data; try { data = JSON.parse(d.text); } catch (e) { throw new Error('That is not a valid backup file'); }
          return api.call('importAll', data).then(refreshInfo).then(function () { toast('Backup restored'); shell(); render(); });
        } });
    };
    $$('[data-csv]', view).forEach(function (b) { b.onclick = function () { exportCSV(b.dataset.csv); }; });
    $$('[data-imp]', view).forEach(function (b) { b.onclick = function () { importCSVDialog(b.dataset.imp); }; });
    $('#dt-samples').onclick = function () { api.call('loadSamples').then(function () { toast('Example data added'); }).catch(fail); };
    $('#dt-reset').onclick = function () {
      modal({ title: 'Erase all data', body: '<p>Type <b>ERASE</b> to delete every record. Your settings are kept.</p><label class="field">Confirm<input name="word" id="rs-word" autocomplete="off"></label>', submitText: 'Erase everything', danger: true,
        onSubmit: function (d) { if (d.word !== 'ERASE') throw new Error('Type ERASE in capitals to confirm'); return api.call('resetAll', true).then(refreshInfo).then(function () { toast('All records erased'); render(); }); } });
    };
  };

  // ---------------------------------------------------------------- boot
  function boot() {
    detectMode().then(function (remote) {
      if (remote) api.mode = 'remote'; else startLocal();
      return refreshInfo();
    }).then(function () {
      if (S.setupDone) shell();
      render();
      window.addEventListener('hashchange', render);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'F2' && has('pos')) { e.preventDefault(); go('pos'); }
      });
    }).catch(function (e) {
      document.getElementById('app').innerHTML = '<div class="setup"><div class="banner">Could not start: ' + esc(e.message) + '</div><div class="toasts" id="toasts"></div></div>';
      if (/PIN/.test(e.message)) askPin();
    });
  }
  boot();
})();

</script>
