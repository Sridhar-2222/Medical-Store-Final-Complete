    api.save = function (col, input) {
      if (EDITABLE.indexOf(col) < 0) fail('Cannot edit ' + col + ' directly');
      return tx(function () {
        input = input || {};
        var existing = input.id ? find(col, input.id) : null;
        var doc;
        if (col === 'items') {
          var oldStock = existing ? existing.stock : 0;
          doc = normItem(input, existing);
          if (!existing) { db.items.push(doc); }
          touch('items', doc);
          if (input.stock !== undefined && input.stock !== '' && doc.trackStock) {
            var diff = r2(num(input.stock) - oldStock);
            if (diff) moveStock(doc, diff, existing ? 'adjust' : 'opening', '', existing ? 'Edited stock' : 'Opening stock');
          }
        } else if (col === 'customers' || col === 'suppliers') {
          doc = normParty(input, existing);
          if (!existing) {
            if (input.openingBalance) doc.balance = r2(num(input.openingBalance));
            db[col].push(doc);
          }
          touch(col, doc);
        } else if (col === 'staff') {
          if (!str(input.name)) fail('Name is required');
          doc = existing || { id: newId(input.id), createdAt: stamp() };
          doc.name = str(input.name); doc.role = str(input.role); doc.phone = str(input.phone);
          doc.commissionRate = num(input.commissionRate); doc.salary = num(input.salary);
          doc.active = input.active === undefined ? true : !!input.active;
          if (!existing) db.staff.push(doc);
          touch('staff', doc);
        } else if (col === 'expenses') {
          if (num(input.amount) <= 0) fail('Amount must be more than zero');
          doc = existing || { id: newId(input.id), createdAt: stamp() };
          doc.date = isDate(input.date) ? input.date : today();
          doc.category = str(input.category) || 'Other';
          doc.amount = r2(num(input.amount)); doc.method = str(input.method) || 'Cash';
          doc.note = str(input.note); doc.staffId = str(input.staffId);
          if (!existing) db.expenses.push(doc);
          touch('expenses', doc);
        } else if (col === 'appointments') {
          if (!isDate(input.date)) fail('Date is required');
          var cust = input.customerId ? find('customers', input.customerId) : null;
          if (!cust && !str(input.customerName)) fail('Customer name is required');
          doc = existing || { id: newId(input.id), createdAt: stamp(), status: 'booked' };
          doc.date = input.date; doc.time = str(input.time) || '10:00';
          doc.customerId = cust ? cust.id : ''; doc.customerName = cust ? cust.name : str(input.customerName);
          doc.phone = cust ? cust.phone : str(input.phone);
          var svc = input.itemId ? find('items', input.itemId) : null;
          doc.itemId = svc ? svc.id : ''; doc.itemName = svc ? svc.name : str(input.itemName);
          doc.durationMin = num(input.durationMin) || (svc ? svc.durationMin : 30);
          doc.staffId = str(input.staffId); doc.notes = str(input.notes);
          if (input.status) doc.status = input.status;
          if (!existing) db.appointments.push(doc);
          touch('appointments', doc);
        }
        return clone(doc);
      });
    };

    api.remove = function (col, id) {
      if (EDITABLE.indexOf(col) < 0) fail('Cannot delete ' + col);
      return tx(function () {
        var d = mustFind(col, id);
        if ((col === 'customers' || col === 'suppliers') && Math.abs(d.balance) > 0.004) fail('Settle the balance before deleting');
        if (col === 'items' && (db.sales.some(function (s) { return s.lines.some(function (l) { return l.itemId === id; }); }) ||
          db.purchases.some(function (p) { return p.lines.some(function (l) { return l.itemId === id; }); }))) {
          // keep history intact: deactivate instead of deleting
          d.active = false; touch('items', d);
          return { deactivated: true };
        }
        db[col] = db[col].filter(function (x) { return x.id !== id; });
        drop(col, id);
        return { deleted: true };
      });
    };

    // ---------- Sales ----------
    api.quote = function (input) { return quote(input || {}); };

    api.createSale = function (input) {
      input = input || {};
      if (input.id && find('sales', input.id)) return clone(find('sales', input.id));
      return tx(function () {
        var s = settings();
        var q = quote(input);
        if (!q.lines.length) fail('Add at least one item');
        var cust = input.customerId ? mustFind('customers', input.customerId, 'Customer') : null;
        var paid = input.paid === undefined || input.paid === '' ? q.total : r2(num(input.paid));
        if (paid < 0) fail('Paid amount cannot be negative');
        var change = 0;
        if (paid > q.total) { change = r2(paid - q.total); paid = q.total; }
        var due = r2(q.total - paid);
        if (due > 0.004 && !cust) fail('Select a customer to give credit (amount due ' + due + ')');

        // stock check first
        var need = {};
        q.lines.forEach(function (l) { if (l.itemId) need[l.itemId] = (need[l.itemId] || 0) + l.qty; });
        Object.keys(need).forEach(function (id) {
          var it = find('items', id);
          if (it.trackStock && !s.allowNegativeStock && !input.replay && it.stock < need[id]) fail('Not enough stock for ' + it.name + ' (available ' + it.stock + ')');
        });

        var sale = Object.assign({ id: newId(input.id), number: nextNumber(s.invoicePrefix || 'INV-'), date: isDate(input.date) ? input.date : today(), at: stamp(),
          customerId: cust ? cust.id : '', customerName: cust ? cust.name : (str(input.customerName) || 'Walk-in'),
          customerPhone: cust ? cust.phone : str(input.customerPhone),
          staffId: str(input.staffId), method: str(input.method) || 'Cash', notes: str(input.notes),
          paid: paid, due: due, change: change, status: due > 0.004 ? (paid > 0 ? 'partial' : 'unpaid') : 'paid',
          appointmentId: str(input.appointmentId) }, q);
        q.lines.forEach(function (l) { if (l.itemId) moveStock(find('items', l.itemId), -l.qty, 'sale', sale.id, sale.number); });
        if (cust) {
          cust.balance = r2(cust.balance + due);
          if (s.loyaltyPercent > 0) { sale.pointsEarned = Math.floor(q.total * s.loyaltyPercent / 100); cust.points = (cust.points || 0) + sale.pointsEarned; }
          cust.lastVisit = sale.date; cust.totalSpent = r2((cust.totalSpent || 0) + q.total);
          touch('customers', cust);
        }
        if (paid > 0) {
          var pay = { id: uid(), date: sale.date, at: stamp(), direction: 'in', partyType: 'customer', partyId: sale.customerId, partyName: sale.customerName, amount: paid, method: sale.method, refId: sale.id, note: 'Against ' + sale.number };
          db.payments.push(pay); touch('payments', pay);
        }
        db.sales.push(sale); touch('sales', sale);
        return clone(sale);
      });
    };

    api.voidSale = function (id, reason) {
      return tx(function () {
        var sale = mustFind('sales', id, 'Sale');
        if (sale.status === 'void') fail('Already cancelled');
        sale.lines.forEach(function (l) { var it = l.itemId && find('items', l.itemId); if (it) moveStock(it, l.qty, 'void', sale.id, 'Cancelled ' + sale.number); });
        var cust = sale.customerId && find('customers', sale.customerId);
        if (cust) {
          cust.balance = r2(cust.balance - sale.due);
          if (sale.pointsEarned) cust.points = Math.max(0, (cust.points || 0) - sale.pointsEarned);
          cust.totalSpent = r2((cust.totalSpent || 0) - sale.total);
          touch('customers', cust);
        }
        if (sale.paid > 0) {
          var refund = { id: uid(), date: today(), at: stamp(), direction: 'out', partyType: 'customer', partyId: sale.customerId, partyName: sale.customerName, amount: sale.paid, method: sale.method, refId: sale.id, note: 'Refund for cancelled ' + sale.number };
          db.payments.push(refund); touch('payments', refund);
        }
        sale.status = 'void'; sale.voidReason = str(reason); sale.voidedAt = stamp(); sale.due = 0;
        touch('sales', sale);
        return clone(sale);
      });
    };

    // ---------- Purchases ----------
    api.createPurchase = function (input) {
      input = input || {};
      if (input.id && find('purchases', input.id)) return clone(find('purchases', input.id));
      return tx(function () {
        var s = settings();
        var p = preset();
        var sup = input.supplierId ? mustFind('suppliers', input.supplierId, 'Supplier') : null;
        var lines = (input.lines || []).filter(function (l) { return l && (l.itemId || str(l.name)) && num(l.qty) > 0; });
        if (!lines.length) fail('Add at least one item with quantity');
        var pur = { id: newId(input.id), number: nextNumber(s.purchasePrefix || 'PUR-'), date: isDate(input.date) ? input.date : today(), at: stamp(),
          supplierId: sup ? sup.id : '', supplierName: sup ? sup.name : (str(input.supplierName) || 'Cash purchase'),
          billNo: str(input.billNo), notes: str(input.notes), method: str(input.method) || 'Cash', lines: [], subtotal: 0, tax: 0, total: 0 };
        lines.forEach(function (l) {
          var it = l.itemId ? mustFind('items', l.itemId, 'Item') : null;
          var batch = str(l.batch);
          if (!it) {
            var nm = str(l.name).toLowerCase();
            it = db.items.filter(function (x) { return x.name.toLowerCase() === nm && (!p.flags.batch || (x.batch || '') === batch); })[0] || null;
          }
          if (!it) {
            it = normItem({ name: l.name, category: l.category, unit: l.unit, price: l.price || 0, cost: l.cost, batch: batch, expiry: l.expiry, taxRate: l.taxRate, barcode: l.barcode });
            db.items.push(it);
          }
          if (it.isService) fail(it.name + ' is a service and has no stock');
          var qty = num(l.qty), cost = r2(num(l.cost, it.cost));
          var free = num(l.free);
          var rate = l.taxRate === undefined || l.taxRate === '' || l.taxRate === null ? 0 : num(l.taxRate);
          var sub = r2(qty * cost), tax = r2(sub * rate / 100);
          it.cost = cost;
          if (num(l.price) > 0) it.price = r2(num(l.price));
          if (batch) it.batch = batch;
          if (isDate(l.expiry)) it.expiry = l.expiry;
          if (it.active === false) it.active = true;
          moveStock(it, qty + free, 'purchase', pur.id, pur.number);
          touch('items', it);
          pur.lines.push({ itemId: it.id, name: it.name, qty: qty, free: free, cost: cost, taxRate: rate, tax: tax, total: r2(sub + tax), batch: it.batch, expiry: it.expiry });
          pur.subtotal = r2(pur.subtotal + sub); pur.tax = r2(pur.tax + tax);
        });
        pur.total = r2(pur.subtotal + pur.tax - num(input.discount));
        var paid = input.paid === undefined || input.paid === '' ? pur.total : Math.min(pur.total, r2(num(input.paid)));
        pur.paid = paid; pur.due = r2(pur.total - paid);
        if (pur.due > 0.004 && !sup) fail('Select a supplier to record an unpaid amount');
        pur.status = pur.due > 0.004 ? (paid > 0 ? 'partial' : 'unpaid') : 'paid';
        if (sup) { sup.balance = r2(sup.balance + pur.due); touch('suppliers', sup); }
        if (paid > 0) {
          var pay = { id: uid(), date: pur.date, at: stamp(), direction: 'out', partyType: 'supplier', partyId: pur.supplierId, partyName: pur.supplierName, amount: paid, method: pur.method, refId: pur.id, note: 'Against ' + pur.number };
          db.payments.push(pay); touch('payments', pay);
        }
        db.purchases.push(pur); touch('purchases', pur);
        return clone(pur);
      });
    };

    api.voidPurchase = function (id, reason) {
      return tx(function () {
        var pur = mustFind('purchases', id, 'Purchase');
        if (pur.status === 'void') fail('Already cancelled');
        pur.lines.forEach(function (l) { var it = find('items', l.itemId); if (it) moveStock(it, -(l.qty + (l.free || 0)), 'void', pur.id, 'Cancelled ' + pur.number); });
        var sup = pur.supplierId && find('suppliers', pur.supplierId);
        if (sup) { sup.balance = r2(sup.balance - pur.due); touch('suppliers', sup); }
        if (pur.paid > 0) {
          var back = { id: uid(), date: today(), at: stamp(), direction: 'in', partyType: 'supplier', partyId: pur.supplierId, partyName: pur.supplierName, amount: pur.paid, method: pur.method, refId: pur.id, note: 'Return for cancelled ' + pur.number };
          db.payments.push(back); touch('payments', back);
        }
        pur.status = 'void'; pur.voidReason = str(reason); pur.due = 0; touch('purchases', pur);
        return clone(pur);
      });
    };

    // ---------- Stock ----------
    api.adjustStock = function (input) {
      return tx(function () {
        var it = mustFind('items', input.itemId, 'Item');
        if (!it.trackStock) fail('Stock is not tracked for services');
        var qty = num(input.qty);
        if (input.mode === 'set') qty = r2(num(input.qty) - it.stock);

    // ---------- Payments (dues) ----------
    api.recordPayment = function (input) {
      return tx(function () {
        var type = input.partyType === 'supplier' ? 'supplier' : 'customer';
        var col = type + 's';
        var party = mustFind(col, input.partyId, type);

        var pay = { id: uid(), date: isDate(input.date) ? input.date : today(), at: stamp(), direction: type === 'customer' ? 'in' : 'out',
          partyType: type, partyId: party.id, partyName: party.name, amount: amount, method: str(input.method) || 'Cash', refId: '', note: str(input.note) || 'Due payment' };
        db.payments.push(pay); touch('payments', pay);
        return clone(party);

    api.ledger = function (partyType, id) {
      var type = partyType === 'supplier' ? 'supplier' : 'customer';

    // ---------- Dashboard & reports ----------
    api.dashboard = function () {
      var s = settings(), t = today(), month = t.slice(0, 7), warn = addDays(t, s.expiryWarnDays);
      var live = db.sales.filter(function (x) { return x.status !== 'void'; });
      function sum(arr, k) { return r2(arr.reduce(function (a, x) { return a + (x[k] || 0); }, 0)); }
      var todays = live.filter(function (x) { return x.date === t; });
      var monthSales = live.filter(function (x) { return x.date.slice(0, 7) === month; });
      var monthExp = db.expenses.filter(function (x) { return x.date.slice(0, 7) === month; });
      var activeItems = db.items.filter(function (i) { return i.active !== false; });
      var days = [];
      for (var i = 13; i >= 0; i--) {
        var d = addDays(t, -i);
        var ds = live.filter(function (x) { return x.date === d; });
        days.push({ date: d, total: sum(ds, 'total'), count: ds.length });
      }
      return {
        today: t,
        todaySales: sum(todays, 'total'), todayCount: todays.length, todayProfit: sum(todays, 'profit'),
        todayCollected: r2(db.payments.filter(function (p) { return p.date === t && p.direction === 'in'; }).reduce(function (a, p) { return a + p.amount; }, 0)),
        monthSales: sum(monthSales, 'total'), monthProfit: sum(monthSales, 'profit'), monthExpenses: sum(monthExp, 'amount'),
        monthNet: r2(sum(monthSales, 'profit') - sum(monthExp, 'amount')),
        receivables: r2(db.customers.reduce(function (a, c) { return a + Math.max(0, c.balance); }, 0)),
        payables: r2(db.suppliers.reduce(function (a, c) { return a + Math.max(0, c.balance); }, 0)),
        stockValue: r2(activeItems.reduce(function (a, i) { return a + (i.trackStock ? Math.max(0, i.stock) * i.cost : 0); }, 0)),
        itemCount: activeItems.length,
        lowStock: clone(activeItems.filter(function (i) { return i.trackStock && i.stock <= i.reorderLevel; }).sort(function (a, b) { return a.stock - b.stock; }).slice(0, 10)),
        lowStockCount: activeItems.filter(function (i) { return i.trackStock && i.stock <= i.reorderLevel; }).length,
        expiring: clone(activeItems.filter(function (i) { return i.expiry && i.expiry <= warn && i.stock > 0; }).sort(function (a, b) { return a.expiry.localeCompare(b.expiry); }).slice(0, 10)),
        appointments: clone(db.appointments.filter(function (a) { return a.date >= t && a.status !== 'cancelled' && a.status !== 'done'; })
          .sort(function (a, b) { return (a.date + a.time).localeCompare(b.date + b.time); }).slice(0, 8)),
        recentSales: clone(db.sales.slice().sort(function (a, b) { return b.at.localeCompare(a.at); }).slice(0, 6)),
        last14: days
      };
    };

    api.report = function (q) {
      q = q || {};
      var t = today();
      var from = isDate(q.from) ? q.from : t.slice(0, 8) + '01';
      var to = isDate(q.to) ? q.to : t;
      function inR(x) { return x.date >= from && x.date <= to; }
      var sales = db.sales.filter(function (x) { return x.status !== 'void' && inR(x); });
      var exps = db.expenses.filter(inR);
      var purs = db.purchases.filter(function (x) { return x.status !== 'void' && inR(x); });
      var pays = db.payments.filter(inR);
      function sum(arr, k) { return r2(arr.reduce(function (a, x) { return a + (x[k] || 0); }, 0)); }
      function group(arr, keyFn, valFn) {
        var m = {};
        arr.forEach(function (x) { var k = keyFn(x); if (!m[k]) m[k] = { key: k }; valFn(m[k], x); });
        return Object.keys(m).map(function (k) { return m[k]; });
      }
      var lines = [];
      sales.forEach(function (sl) { sl.lines.forEach(function (l) { lines.push(l); }); });
      var staffNames = {}; db.staff.forEach(function (st) { staffNames[st.id] = st; });
      var r = {
        from: from, to: to,
        salesCount: sales.length, salesTotal: sum(sales, 'total'), tax: sum(sales, 'tax'), net: sum(sales, 'net'),
        discount: r2(sum(sales, 'billDiscount') + sum(sales, 'lineDiscount')),
        cost: sum(sales, 'cost'), grossProfit: sum(sales, 'profit'), expenses: sum(exps, 'amount'),
        purchases: sum(purs, 'total'), creditGiven: sum(sales, 'due'),

  // ---------------------------------------------------------------- dashboard
  function barChart(days, valueKey) {
    var W = 640, H = 180, padL = 52, padB = 26, padT = 10;
    var max = Math.max.apply(null, days.map(function (d) { return d[valueKey]; }).concat([0]));
    var nice = niceMax(max);
    var bw = (W - padL - 8) / days.length;
    var g = '';
    [0, .5, 1].forEach(function (f) {
      var y = padT + (H - padT - padB) * (1 - f);
      g += '<line class="grid-line" x1="' + padL + '" x2="' + (W - 4) + '" y1="' + y + '" y2="' + y + '"></line>' +
        '<text x="' + (padL - 6) + '" y="' + (y + 3) + '" text-anchor="end">' + esc(short(nice * f)) + '</text>';
    });
    days.forEach(function (d, i) {
      var v = d[valueKey], h = nice ? (H - padT - padB) * v / nice : 0;
      var x = padL + i * bw + bw * .18, y = H - padB - h;
      g += '<rect class="bar' + (v ? '' : ' zero') + '" x="' + x.toFixed(1) + '" y="' + (v ? y : H - padB - 1).toFixed(1) + '" width="' + (bw * .64).toFixed(1) + '" height="' + (v ? Math.max(h, 1) : 1).toFixed(1) + '" rx="2"><title>' + esc(d.key || d.date) + ': ' + esc(money(v)) + '</title></rect>';
      if (days.length <= 16 || i % Math.ceil(days.length / 12) === 0) {
        g += '<text x="' + (x + bw * .32).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc((d.key || d.date).slice(8, 10)) + '</text>';
      }
    });
    return '<div class="bars"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Sales by day">' + g + '</svg></div>';
  }
  function niceMax(v) { if (v <= 0) return 0; var p = Math.pow(10, Math.floor(Math.log10(v))); var n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

        $$('[data-qty]', el).forEach(function (i) { i.oninput = function () { cart.lines[+i.dataset.qty].qty = i.value; updateTotals(); }; i.onchange = drawCart; });

        $('#cart-paid', el).oninput = function (e) { cart.paid = e.target.value; updateTotals(); };
        $('#cart-newcust', el).onclick = function () { editParty('customers', null, function (c) { customers.push(c); cart.customerId = c.id; drawCart(); }); };
        $('#cart-go', el).onclick = checkout;

      }
      var updateTotals = debounce(function () {
        var box = $('#cart-totals'); if (!box) return;
        if (!cart.lines.length) { box.innerHTML = ''; return; }
        api.call('quote', { lines: cart.lines, discount: cart.discount }).then(function (q) {
          if (!document.body.contains(box)) return;
          var paid = cart.paid === '' ? q.total : Number(cart.paid);
          var rows = '<div><span>Subtotal</span><span>' + esc(money(q.subtotal)) + '</span></div>' +
            (q.billDiscount ? '<div><span>Discount</span><span>−' + esc(money(q.billDiscount)) + '</span></div>' : '') +
            '<div><span>' + esc(S.taxLabel || 'Tax') + (S.taxInclusive ? ' (included)' : '') + '</span><span>' + esc(money(q.tax)) + '</span></div>' +
            '<div class="grand"><span>Total</span><span>' + esc(money(q.total)) + '</span></div>';

          else if (paid < q.total) rows += '<div style="color:var(--bad)"><span>Due (credit)</span><b>' + esc(money(q.total - paid)) + '</b></div>';
          box.innerHTML = rows;

      }, 120);
      function resetCart() { cart = { lines: [], customerId: '', staffId: '', discount: 0, method: 'Cash', paid: '', notes: '', appointmentId: '' }; }
      function checkout() {
        var payload = { lines: cart.lines.map(function (l) { return { itemId: l.itemId, qty: l.qty, price: l.price, discount: l.discount }; }),
          customerId: cart.customerId, staffId: cart.staffId, discount: cart.discount, method: cart.method, paid: cart.paid };
        api.call('createSale', payload).then(function (sale) {
          resetCart();

      var search = $('#pos-search');

      search.onkeydown = function (e) {

        var code = search.value.trim(); if (!code) return;
        var exact = items.filter(function (i) { return (i.barcode && i.barcode === code) || (i.sku && i.sku.toLowerCase() === code.toLowerCase()); })[0];
        var hits = exact ? [exact] : items.filter(function (i) { return i.name.toLowerCase().indexOf(code.toLowerCase()) >= 0; });
        if (hits.length === 1 || exact) { add(hits[0].id); search.value = ''; filter.q = ''; drawCatalog(); }
        else if (!hits.length) toast('No ' + label('item').toLowerCase() + ' matches "' + code + '"', true);
      };
      $$('[data-cat]', view).forEach(function (b) { b.onclick = function () { filter.cat = b.dataset.cat; $$('[data-cat]', view).forEach(function (x) { x.classList.toggle('on', x === b); }); drawCatalog(); }; });
      drawCatalog(); drawCart();
      setTimeout(function () { search.focus(); }, 50);
    });
  };

  function listPage(view, cfg) {
    var state = { search: '', filter: cfg.defaultFilter || '', from: cfg.dates ? cfg.from || '' : '', to: '' };
    view.innerHTML = '<div class="panel"><div class="panel-head"><input class="search" id="lp-search" placeholder="Search…" autocomplete="off">' +

      (cfg.dates ? '<div class="row"><input type="date" id="lp-from" style="width:auto" aria-label="From"><input type="date" id="lp-to" style="width:auto" aria-label="To"></div>' : '') +
      '<span class="spacer"></span>' + (cfg.actions || '') + '</div><div id="lp-summary"></div><div class="table-wrap" id="lp-table"></div></div>';
    function load() {
      var q = { search: state.search, filter: state.filter, from: state.from, to: state.to, sort: cfg.sort };
      if (cfg.statusFilter && state.filter) { q.status = state.filter; delete q.filter; }
      return api.call('list', cfg.col, q).then(function (res) {
        var rows = res.rows;
        if (!$('#lp-table', view)) return; // user moved to another page meanwhile
        if (cfg.summary) $('#lp-summary', view).innerHTML = cfg.summary(rows);
        $('#lp-table', view).innerHTML = rows.length ? '<table><thead><tr>' + cfg.columns.map(function (c) { return '<th class="' + (c.num ? 'num' : '') + '">' + esc(c.title) + '</th>'; }).join('') + '<th></th></tr></thead><tbody>' +
          rows.slice(0, 500).map(function (r) {
            return '<tr class="' + (cfg.onRow ? 'clickable' : '') + '" data-id="' + r.id + '">' + cfg.columns.map(function (c) { return '<td class="' + (c.num ? 'num' : '') + '">' + c.cell(r) + '</td>'; }).join('') +
              '<td class="actions">' + (cfg.rowActions ? cfg.rowActions(r) : '') + '</td></tr>';
          }).join('') + '</tbody></table>' + (rows.length > 500 ? '<p class="muted">Showing first 500 of ' + rows.length + '. Use search to narrow.</p>' : '')
          : emptyState(cfg.emptyTitle || 'Nothing here yet', state.search || state.filter ? 'Try clearing the search or filter.' : (cfg.emptyHint || ''), cfg.emptyAction || '');
        $$('[data-proxy]', view).forEach(function (b) { b.onclick = function () { var t = document.getElementById(b.dataset.proxy); if (t) t.click(); }; });
        $$('tr[data-id]', view).forEach(function (tr) {
          if (cfg.onRow) tr.onclick = function (e) { if (e.target.closest('button,a')) return; cfg.onRow(rows.filter(function (r) { return r.id === tr.dataset.id; })[0]); };
        });
        $$('[data-act]', view).forEach(function (b) {
          b.onclick = function (e) { e.stopPropagation(); var r = rows.filter(function (x) { return x.id === b.closest('tr').dataset.id; })[0]; cfg.onAction(b.dataset.act, r, load); };
        });
        if (cfg.afterLoad) cfg.afterLoad(rows, load);
      });
    }
    $('#lp-search', view).oninput = debounce(function (e) { state.search = e.target.value; load(); }, 200);
    $$('[data-f]', view).forEach(function (b) { b.onclick = function () { state.filter = b.dataset.f; $$('[data-f]', view).forEach(function (x) { x.classList.toggle('on', x === b); }); load(); }; });
    if (cfg.dates) {
      $('#lp-from', view).value = state.from;
      $('#lp-from', view).onchange = function (e) { state.from = e.target.value; load(); };
      $('#lp-to', view).onchange = function (e) { state.to = e.target.value; load(); };
    }
    if (cfg.bind) cfg.bind(view, load);
    return load();
  }

  // ---------------------------------------------------------------- purchases
  function purchaseDialog(after) {
    Promise.all([api.call('list', 'suppliers', {}), api.call('list', 'items', { filter: 'products' })]).then(function (res) {
      var sups = res[0].rows, items = res[1].rows.filter(function (i) { return i.active !== false; });
      var f = P.flags;
      var lines = [];
      var hdr = '<th>' + esc(label('item')) + '</th><th>Qty</th><th>Free</th><th>Cost</th><th>Sell price</th>' + (f.batch ? '<th>Batch</th>' : '') + (f.expiry ? '<th>Expiry</th>' : '') + '<th>Tax %</th><th></th>';
      var m = modal({ title: 'Record purchase (stock in)', wide: true, submitText: 'Save purchase',
        body: '<div class="form-grid"><label class="field">Supplier<select name="supplierId" id="pu-sup">' + opt(sups.map(function (s) { return { value: s.id, text: s.name }; }), '', '— cash purchase —') + '</select></label>' +

          '<label class="field">Amount paid now<input type="number" step="any" min="0" name="paid" id="pu-paid" placeholder="Full amount"></label>' +
          '<label class="field">Paid by<select name="method" id="pu-method">' + opt(INFO.paymentMethods.filter(function (x) { return x !== 'Credit'; })) + '</select></label></div>' +
          '<div class="row"><label class="btn" for="pu-ai-file">📷 Read bill photo with AI</label><input type="file" id="pu-ai-file" accept="image/*,application/pdf" hidden><span class="muted" id="pu-ai-status">Fills the lines below for you to check.</span></div>' +
          '<datalist id="pu-items">' + items.map(function (i) { return '<option value="' + esc(i.name) + '">' + esc((i.batch ? i.batch + ' · ' : '') + 'stock ' + qtyFmt(i.stock)) + '</option>'; }).join('') + '</datalist>' +
          '<div class="table-wrap"><table><thead><tr>' + hdr + '</tr></thead><tbody id="pu-lines"></tbody></table></div>' +
          '<div class="row"><button type="button" class="btn sm" id="pu-add">＋ Add line</button><span class="spacer"></span><b id="pu-total"></b></div>',
        onSubmit: function (d) {
          var payload = { supplierId: d.supplierId, billNo: d.billNo, date: d.date, paid: d.paid, method: d.method, lines: lines.filter(function (l) { return l.name && Number(l.qty) > 0; }) };
          payload.lines.forEach(function (l) { var it = items.filter(function (i) { return i.name.toLowerCase() === l.name.toLowerCase() && (!f.batch || !l.batch || i.batch === l.batch); })[0]; if (it && (!f.batch || it.batch === l.batch || !l.batch)) l.itemId = it.id; else delete l.itemId; });
          return api.call('createPurchase', payload).then(function (p) { toast('Purchase ' + p.number + ' saved · stock updated'); if (after) after(); });
        } });
      var tb = $('#pu-lines', m.form);
      function inp(i, k, type, w) { return '<td><input data-l="' + i + '" data-k="' + k + '" type="' + type + '" step="any" value="' + esc(lines[i][k]) + '" style="min-width:' + w + 'px"' + (k === 'name' ? ' list="pu-items"' : '') + '></td>'; }
      function draw() {
        tb.innerHTML = lines.map(function (l, i) {
          return '<tr>' + inp(i, 'name', 'text', 180) + inp(i, 'qty', 'number', 64) + inp(i, 'free', 'number', 56) + inp(i, 'cost', 'number', 80) + inp(i, 'price', 'number', 80) +
            (f.batch ? inp(i, 'batch', 'text', 90) : '') + (f.expiry ? inp(i, 'expiry', 'date', 130) : '') + inp(i, 'taxRate', 'number', 56) +
            '<td><button type="button" class="btn ghost sm" data-rm="' + i + '" aria-label="Remove line">✕</button></td></tr>';
        }).join('');
        $$('input[data-l]', tb).forEach(function (el) {
          el.oninput = function () {
            var l = lines[+el.dataset.l]; l[el.dataset.k] = el.value;
            if (el.dataset.k === 'name') {
              var it = items.filter(function (x) { return x.name.toLowerCase() === el.value.toLowerCase(); })[0];
              if (it && !l.cost) { l.cost = it.cost; l.price = it.price; l.batch = l.batch || ''; draw(); var again = $('input[data-l="' + el.dataset.l + '"][data-k="qty"]', tb); if (again) again.focus(); return; }
            }
            total();
          };
        });
        $$('[data-rm]', tb).forEach(function (b) { b.onclick = function () { lines.splice(+b.dataset.rm, 1); if (!lines.length) lines.push(blank()); draw(); }; });
        total();
      }
      function blank() { return { name: '', qty: '', free: '', cost: '', price: '', batch: '', expiry: '', taxRate: '' }; }
      function total() {
        var t = lines.reduce(function (a, l) { return a + (Number(l.qty) || 0) * (Number(l.cost) || 0) * (1 + (Number(l.taxRate) || 0) / 100); }, 0);
        $('#pu-total', m.form).textContent = 'Total ' + money(t);
      }
      $('#pu-add', m.form).onclick = function () { lines.push(blank()); draw(); };
      $('#pu-ai-file', m.form).onchange = function (e) {
        var file = e.target.files[0]; if (!file) return;
        var st = $('#pu-ai-status', m.form); st.textContent = 'Reading bill… this takes 5–20 seconds';
        readFile(file, true).then(function (dataUrl) {
          var base64 = String(dataUrl).split(',')[1];
          return readBillAI(base64, file.type || 'image/jpeg');
        }).then(function (got) {
          if (!got.length) { st.textContent = 'Could not find any lines. Try a clearer photo, or type them in.'; return; }
          lines = lines.filter(function (l) { return l.name; }).concat(got.map(function (g) { return { name: g.name, qty: g.qty, free: g.free || '', cost: g.cost, price: g.price || '', batch: g.batch, expiry: g.expiry, taxRate: g.taxRate || '' }; }));
          draw(); st.textContent = 'Read ' + got.length + ' lines. Check them before saving.';
        }).catch(function (err) { st.textContent = err.message; });
      };
      lines.push(blank()); draw();
    }).catch(fail);
  }
  function readBillAI(base64, mimeType) {
    if (api.mode === 'remote') {
      if (!api.online) return Promise.reject(new Error('Reading bills with AI needs an internet connection.'));
      return http('api/ai/read-bill', { base64: base64, mimeType: mimeType }, 60000).then(function (j) { if (!j.ok) throw new Error(j.error); return j.result; });
    }
    var key = lsGet(LS_AIKEY);
    if (!key) return Promise.reject(new Error('Add a Google Gemini API key in Settings → AI bill reading to use this.'));
    return AI.readBill(window.fetch.bind(window), { apiKey: key, model: S.geminiModel, base64: base64, mimeType: mimeType, presetName: P.name, itemLabel: P.labels.item });
  }

        A.modal({ title: 'New customer', body: '<div class="form-grid"><label class="field">Name<input name="name" id="nc-name"></label><label class="field">WhatsApp number<input name="phone" id="nc-phone" type="tel" inputmode="tel"></label>' +
          '<label class="field">Email<input name="email" id="nc-email" type="email"></label><label class="field wide">Notes<input name="notes" id="nc-notes"></label></div>',
          onSubmit: function (d) { return api.call('save', 'customers', d).then(function (c) { A.toast('Vault created for ' + c.name); A.render(); setTimeout(function () { openVault(c.id, A.render); }, 300); }); } });
      };
      table();
    });
  };

  // ------------------------------------------------------------ Guide for each business type
  var guideKey = '';
  A.PAGES.guide = function (view) {
    A.setTitle('Guide');
    var I = A.Industries;
    var key = guideKey || A.S.industry;
    var p = I.get(key), rv = p.review, pb = rv.playbook;
    function list(items) { return '<ul class="summary">' + items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>'; }
    view.innerHTML = '<div class="panel stack"><div class="row"><label class="field" style="width:auto">Business type<select id="gd-ind">' + A.opt(I.list().map(function (i) { return { value: i.key, text: i.icon + ' ' + i.name }; }), key) + '</select></label>' +
      '<span class="muted" style="max-width:60ch">How BizCore works for this kind of business: who reports numbers, what to photograph, what you learn, and what your customers get.</span></div></div>' +
      '<div class="grid grid-2">' +
      '<div class="panel stack"><h2>Departments involved</h2>' + list(rv.departments) + '</div>' +
      '<div class="panel stack"><h2>Photograph these</h2>' + list(pb.photos) + '<p class="muted">Use Scan receipts. The phone reads them offline; AI reading is optional.</p></div>' +
      '<div class="panel stack"><h2>Enter these</h2>' + list(pb.inputs) + '</div>' +
      '<div class="panel stack"><h2>What you learn as the owner</h2>' + list(pb.owner) + '</div>' +
      '<div class="panel stack"><h2>What your customers get</h2>' + list(pb.customers) + '</div>' +
      '<div class="panel stack"><h2>Customer vault for ' + esc(p.name) + '</h2><b>Kept for each customer</b>' + list(rv.vault.records.map(function (r) { return r.label + (r.dueLabel ? ' (reminds: ' + r.dueLabel.toLowerCase() + ')' : ''); })) +
        '<b>Ready messages</b>' + list(rv.vault.templates.map(function (t) { return t.label; })) + '</div>' +
      '</div>' +
      '<div class="panel"><div class="panel-head"><h2>Key numbers and healthy ranges</h2></div><ul class="kpis">' + rv.kpis.map(function (k) {
        return '<li><div class="kpi-top"><b>' + esc(k.label) + '</b><span class="pill ink">' + k.lo + '–' + k.hi + '%</span></div><div class="muted">' + esc(k.why) + '</div></li>';
      }).join('') + '</ul></div>';
    $('#gd-ind', view).onchange = function (e) { guideKey = e.target.value; A.render(); };
  };

  // ------------------------------------------------------------ Departments
  A.PAGES.departments = function (view) {
    A.setTitle('Departments');
    return deps().then(function (list) {
      view.innerHTML = '<div class="panel"><div class="panel-head"><h2>Departments</h2><button type="button" class="btn primary" id="dp-new">＋ Add department</button></div>' +
        '<p class="muted">Each department reports its own sales, collections, expenses, purchases and wastage. Suggested ones for ' + esc(A.P.name) + ' were added for you; rename or add as needed.</p>' +
        (list.length ? '<div class="table-wrap"><table><thead><tr><th>Name</th><th>Reports</th><th>Status</th><th></th></tr></thead><tbody>' + list.map(function (d) {
          return '<tr data-id="' + d.id + '"><td><b>' + esc(d.name) + '</b></td><td>' + esc({ revenue: 'Sales only', cost: 'Costs only', both: 'Sales and costs' }[d.kind || 'both']) + '</td><td>' + (d.active === false ? '<span class="pill">hidden</span>' : '<span class="pill good">active</span>') + '</td>' +
            '<td class="actions"><button type="button" class="btn sm ghost" data-edit="' + d.id + '">Edit</button><button type="button" class="btn sm ghost" data-del="' + d.id + '" aria-label="Delete">✕</button></td></tr>';
        }).join('') + '</tbody></table></div>' : A.emptyState('No departments', 'Add the parts of your business that report numbers.')) + '</div>';
      function edit(d) {
        A.modal({ title: d ? 'Edit department' : 'New department', body: '<div class="form-grid"><label class="field">Name<input name="name" id="dp-name" value="' + esc(d ? d.name : '') + '"></label>' +
          '<label class="field">Reports<select name="kind" id="dp-kind">' + A.opt([{ value: 'both', text: 'Sales and costs' }, { value: 'revenue', text: 'Sales only' }, { value: 'cost', text: 'Costs only' }], d ? d.kind : 'both') + '</select></label>' +
          '<label class="check"><input type="checkbox" name="active" id="dp-active"' + (!d || d.active !== false ? ' checked' : '') + '> Active</label></div>',
          onSubmit: function (x) { if (d) x.id = d.id; return api.call('saveDepartment', x).then(function () { A.toast('Saved'); A.render(); }); } });
      }
      $('#dp-new', view).onclick = function () { edit(null); };
      $$('[data-edit]', view).forEach(function (b) { b.onclick = function () { edit(list.filter(function (d) { return d.id === b.dataset.edit; })[0]); }; });
      $$('[data-del]', view).forEach(function (b) {
        b.onclick = function () {
          var d = list.filter(function (x) { return x.id === b.dataset.del; })[0];
          A.confirmBox('Remove ' + d.name + '? If it has entries it is hidden instead, so history stays correct.', 'Remove', true).then(function (ok) {
            if (ok) api.call('removeDepartment', d.id).then(function (r) { A.toast(r.deactivated ? 'Hidden' : 'Removed'); A.render(); }).catch(A.fail);
          });
        };
      });
    });
  };
})();

</script>
