<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medical Store - Stock</title>
<style>
*{font-family: system-ui; box-sizing: border-box} body{margin:0;background:#f6f8fb;padding:15px}
.card{background:white;border-radius:16px;padding:16px;box-shadow:0 2px 10px #0001;margin-bottom:15px}
.btn{background:#0d7c3e;color:white;border:0;padding:12px 18px;border-radius:10px;font-weight:600;cursor:pointer;width:100%}
input[type=file]{margin:10px 0} table{width:100%;border-collapse:collapse} th,td{padding:10px;text-align:left;border-bottom:1px solid #eee;font-size:14px}
.badge{background:#fee;color:#b00;padding:3px 8px;border-radius:20px;font-size:12px}
.top{display:flex;gap:10px}
</style></head><body>
<h2>💊 Medical Store - Ready App</h2>
<div class="card">
<h3>📤 Upload Bill (Web)</h3>
<input type="file" id="billFile" accept="image/*,.pdf"><button class="btn" onclick="uploadBill()">Upload & Add to Stock</button>
<p id="status"></p>
</div>
<div class="top">
<div class="card" style="flex:1"><h3>📦 Total Medicines</h3><h1 id="total">-</h1></div>
<div class="card" style="flex:1"><h3>⚠️ Low Stock</h3><h1 id="low">-</h1></div>
</div>
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><h3>Stock List</h3><button onclick="load()">Refresh</button></div>
<table><thead><tr><th>Name</th><th>Batch</th><th>Qty</th><th>MRP</th><th>Expiry</th></tr></thead><tbody id="list"></tbody></table>
</div>
<script>
const API = '';
async function uploadBill(){
 const f=document.getElementById('billFile').files[0]; if(!f) return alert('Select bill');
 const fd=new FormData(); fd.append('bill', f);
 document.getElementById('status').innerText='Reading...';
 let data={};
 try{const res=await fetch('/api/upload-bill',{method:'POST',body:fd}); data=await res.json();}catch(e){data={error:e.message};}
 document.getElementById('status').innerText=data.success?`Added ${data.count} items ✅`:`Failed ❌ ${data.error||''}`;
 load();
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
 const res=await fetch('/api/medicines'); const data=await res.json();
 if(!res.ok||!Array.isArray(data)){document.getElementById('list').innerHTML=`<tr><td colspan=5>Could not load stock: ${esc(data&&data.error)}</td></tr>`;return;}
 document.getElementById('total').innerText=data.length;
 document.getElementById('low').innerText=data.filter(d=>d.quantity<10).length;
 document.getElementById('list').innerHTML=data.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.batch)}</td><td>${esc(m.quantity)}</td><td>${esc(m.mrp)}</td><td>${m.expiry?esc(String(m.expiry).slice(0,7)):''} ${m.quantity<10?'<span class=badge>Low</span>':''}</td></tr>`).join('');
}
load();
</script></body></html>
