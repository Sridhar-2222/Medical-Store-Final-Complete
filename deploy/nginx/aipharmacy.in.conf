# /etc/nginx/sites-available/aipharmacy.in  (symlink into sites-enabled)
# Prerequisite: DNS A records for aipharmacy.in, www and n8n -> the Hostinger VPS IP.
# First issue certificates (HTTP-01):
#   sudo certbot certonly --nginx -d aipharmacy.in -d www.aipharmacy.in -d n8n.aipharmacy.in
# Then: sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# HTTP -> HTTPS (keeps ACME challenge reachable for renewals)
server {
    listen 80;
    listen [::]:80;
    server_name aipharmacy.in www.aipharmacy.in n8n.aipharmacy.in;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# www -> apex
server {
    listen 443 ssl http2;        # Nginx >= 1.25.1 may prefer: listen 443 ssl; http2 on;
    listen [::]:443 ssl http2;
    server_name www.aipharmacy.in;
    ssl_certificate     /etc/letsencrypt/live/aipharmacy.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aipharmacy.in/privkey.pem;
    return 301 https://aipharmacy.in$request_uri;
}

# Main app (Node, bound to 127.0.0.1:10000)
server {
    listen 443 ssl http2;        # Nginx >= 1.25.1 may prefer: listen 443 ssl; http2 on;
    listen [::]:443 ssl http2;
    server_name aipharmacy.in;

    ssl_certificate     /etc/letsencrypt/live/aipharmacy.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aipharmacy.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 12m;   # bill photos/PDF (app limit MAX_UPLOAD_MB=10)

    location = /health { proxy_pass http://127.0.0.1:10000; access_log off; }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:10000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;     # Gemini bill reading can take ~10-30s
    }

    location / {
        proxy_pass http://127.0.0.1:10000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# n8n (Docker, bound to 127.0.0.1:5678)
server {
    listen 443 ssl http2;        # Nginx >= 1.25.1 may prefer: listen 443 ssl; http2 on;
    listen [::]:443 ssl http2;
    server_name n8n.aipharmacy.in;

    ssl_certificate     /etc/letsencrypt/live/aipharmacy.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aipharmacy.in/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;     # n8n editor uses websockets
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
