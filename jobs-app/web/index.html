<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6b4f">
<title>Jobs Page</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <a href="/j" class="brand" id="brand">Jobs</a>
  <nav id="nav"></nav>
</header>
<main id="view" aria-live="polite"></main>
<div id="toast" role="status"></div>
<dialog id="poster">
  <div class="poster-wrap">
    <canvas id="posterCanvas" width="1080" height="1350"></canvas>
    <div class="row">
      <button class="btn" id="posterShare">Share image</button>
      <button class="btn ghost" id="posterSave">Save image</button>
      <button class="btn ghost" id="posterClose">Close</button>
    </div>
    <p class="muted small">Post it on a WhatsApp status, group or Instagram. The QR code still works after a screenshot.</p>
  </div>
</dialog>
<script src="/speech.js"></script>
<script src="/poster.js"></script>
<script src="/app.js"></script>
</body>
</html>
