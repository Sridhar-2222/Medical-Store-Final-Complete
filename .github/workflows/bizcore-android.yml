# Builds the BizCore Android APK on GitHub's servers (Actions tab -> "BizCore Android APK" -> Run workflow).
# Optional repository secrets for a release-signed APK that can update the installed app:
#   BIZCORE_KEYSTORE_B64 (base64 of bizcore-release.jks), BIZCORE_KEYSTORE_PASSWORD
# Without them the APK is signed with a temporary debug key.
name: BizCore Android APK
on:
  workflow_dispatch:
  push:
    paths: ['generic-app/public/**', 'generic-app/core/**', 'generic-app/android-app/**']
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: generic-app/android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci || npm install
      - run: node prepare-web.js && npx cap sync android
      - name: Restore signing key
        env:
          KS: ${{ secrets.BIZCORE_KEYSTORE_B64 }}
          PW: ${{ secrets.BIZCORE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p keystore && echo "$KS" | base64 -d > keystore/bizcore-release.jks
            printf "storeFile=../../keystore/bizcore-release.jks\nstorePassword=%s\nkeyAlias=bizcore\nkeyPassword=%s\n" "$PW" "$PW" > keystore/keystore.properties
          fi
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleRelease assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BizCore-apk
          path: |
            generic-app/android-app/android/app/build/outputs/apk/release/*.apk
            generic-app/android-app/android/app/build/outputs/apk/debug/*.apk
